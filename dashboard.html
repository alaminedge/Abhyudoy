<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cabinet+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.08);--teal-glow:rgba(0,212,170,0.2);
  --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;
  --red:#f0566a;--orange:#f59e0b;--radius:12px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}

/* NAV */
nav{background:rgba(11,15,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;letter-spacing:-0.02em;text-decoration:none;color:var(--white)}
.nav-logo em{font-style:italic;color:var(--teal)}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-user{display:flex;align-items:center;gap:10px}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.72rem;flex-shrink:0}
.nav-name{font-size:0.82rem;font-weight:600;color:var(--gray2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{padding:7px 16px;background:transparent;border:1.5px solid var(--border2);color:var(--gray);border-radius:20px;cursor:pointer;font-size:0.72rem;font-weight:600;font-family:'Cabinet Grotesk',sans-serif;transition:all .2s;letter-spacing:0.04em;text-transform:uppercase}
.btn-out:hover{border-color:var(--red);color:var(--red)}

/* HERO */
.hero{max-width:1200px;margin:0 auto;padding:52px 28px 36px}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero-eyebrow::before{content:'';display:block;width:20px;height:1.5px;background:var(--teal)}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.hero p{font-size:0.85rem;color:var(--gray);max-width:480px;line-height:1.6}

/* GRID */
.main{max-width:1200px;margin:0 auto;padding:0 28px 80px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

.course-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s;position:relative;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.5),0 0 0 1px rgba(0,212,170,0.12);border-color:rgba(0,212,170,0.18)}
.course-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--teal2));opacity:0;transition:opacity .3s}
.course-card:hover::before{opacity:1}

.card-thumb{width:100%;height:160px;background:linear-gradient(135deg,#0d1422,#111827);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-thumb-placeholder{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:700;color:rgba(0,212,170,0.15);letter-spacing:-0.02em;user-select:none}
.card-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,15,26,0.7) 0%,transparent 60%)}

.card-body{padding:20px;flex:1;display:flex;flex-direction:column}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;line-height:1.3}
.card-desc{font-size:0.76rem;color:var(--gray);line-height:1.5;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}

.card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.expiry-pill{font-family:'DM Mono',monospace;font-size:0.64rem;font-weight:500;padding:4px 10px;border-radius:20px}
.pill-active{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,0.2)}
.pill-warn{background:rgba(245,158,11,0.1);color:var(--orange);border:1px solid rgba(245,158,11,0.2)}
.pill-expired{background:rgba(240,86,106,0.1);color:var(--red);border:1px solid rgba(240,86,106,0.2)}
.card-arrow{width:28px;height:28px;border-radius:50%;background:var(--teal-dim);border:1px solid rgba(0,212,170,0.2);display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:0.8rem;transition:all .2s}
.course-card:hover .card-arrow{background:var(--teal);color:#000;border-color:var(--teal)}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--gray)}
.empty-icon{font-size:3rem;margin-bottom:16px;opacity:0.5}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--white);margin-bottom:8px}
.empty p{font-size:0.82rem;line-height:1.6}

/* LOADING */
.loading{text-align:center;padding:80px;color:var(--gray)}
.ring{width:36px;height:36px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){.hero{padding:36px 16px 24px}.main{padding:0 16px 60px}}
</style>
</head>
<body>
<nav>
  <a href="/dashboard.html" class="nav-logo">Abhy<em>udoy</em></a>
  <div class="nav-right">
    <div class="nav-user">
      <div class="nav-avatar" id="navAvatar">U</div>
      <span class="nav-name" id="navName"></span>
    </div>
    <button class="btn-out" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-eyebrow">My Learning</div>
  <h1>Your Courses</h1>
  <p>Access all your enrolled courses with active memberships.</p>
</div>

<div class="main">
  <div id="content"><div class="loading"><div class="ring"></div><p style="font-size:.82rem">Loading your courses…</p></div></div>
</div>

<script>
const token=localStorage.getItem('abhyudoy_token');
const user=JSON.parse(localStorage.getItem('abhyudoy_user')||'null');
if(!token||!user){window.location.href='/index.html';}
document.getElementById('navName').textContent=user.name;
document.getElementById('navAvatar').textContent=user.name.charAt(0).toUpperCase();

async function loadCourses(){
  try{
    const res=await fetch('/api/user/my-courses',{headers:{Authorization:'Bearer '+token}});
    if(res.status===401){window.location.href='/index.html';return}
    const courses=await res.json();
    const content=document.getElementById('content');
    if(!courses.length){
      content.innerHTML=`<div class="empty"><div class="empty-icon">📚</div><h3>No Active Courses</h3><p>You don't have any active course memberships yet.<br>Contact your admin for access.</p></div>`;
      return;
    }
    content.innerHTML=`<div class="course-grid">${courses.map(c=>{
      const exp=new Date(c.expires_at),now=new Date();
      const days=Math.ceil((exp-now)/(86400000));
      let pillClass='pill-active',pillText=`Expires ${exp.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
      if(days<0){pillClass='pill-expired';pillText='Expired';}
      else if(days<=7){pillClass='pill-warn';pillText=`${days}d remaining`;}
      const thumb=c.thumbnail?`<img src="${esc(c.thumbnail)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'';
      const placeholder=`<div class="card-thumb-placeholder">${esc(c.title.charAt(0))}</div>`;
      return`<div class="course-card" onclick="window.location.href='/course.html?id=${c.id}'">
        <div class="card-thumb">${thumb}${placeholder}<div class="card-thumb-overlay"></div></div>
        <div class="card-body">
          <div class="card-title">${esc(c.title)}</div>
          <div class="card-desc">${esc(c.description||'No description available.')}</div>
          <div class="card-footer">
            <span class="expiry-pill ${pillClass}">${pillText}</span>
            <div class="card-arrow">→</div>
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }catch(e){document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Error</h3><p>Failed to load courses. Please refresh.</p></div>'}
}

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function logout(){localStorage.clear();window.location.href='/index.html'}
loadCourses();
</script>
</body>
</html>
