<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lecture — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cabinet+Grotesk:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.1);
  --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;--red:#f0566a;
  --radius:9px;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Cabinet Grotesk',sans-serif;color:var(--white);overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

/* SHELL */
.shell{display:flex;flex-direction:column;height:100vh;padding:10px 14px 8px;gap:8px;max-width:1480px;margin:0 auto}

/* TOP BAR */
.tbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:36px;gap:12px}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:var(--white);text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;flex-shrink:0}
.brand em{font-style:italic;color:var(--teal)}
.brand-dot{width:6px;height:6px;background:var(--teal);border-radius:50%;box-shadow:0 0 8px var(--teal);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tbar-center{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.lec-title-bar{font-family:'Cormorant Garamond',serif;font-size:.92rem;font-weight:600;color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;text-align:center;letter-spacing:-.01em}
.tbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.back-link{display:flex;align-items:center;gap:6px;color:var(--gray);text-decoration:none;font-size:.74rem;font-weight:500;transition:color .2s;padding:6px 12px;border:1px solid var(--border2);border-radius:20px}
.back-link:hover{color:var(--teal);border-color:rgba(0,212,170,.3)}
.back-link svg{width:13px;height:13px;fill:currentColor}

/* BODY */
.body{display:flex;gap:10px;flex:1;min-height:0}

/* SIDEBAR */
.sidebar{width:278px;flex-shrink:0;background:var(--surface);border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:13px 15px 9px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-course{font-family:'DM Mono',monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-count{font-size:.72rem;color:var(--gray);font-weight:400}
.track-list{flex:1;overflow-y:auto;padding:5px}

.track-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:2px}
.track-item:hover{background:var(--surface2)}
.track-item.active{background:var(--teal-dim);border-color:rgba(0,212,170,.2)}
.t-num{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--gray);width:18px;text-align:center;flex-shrink:0;font-weight:500}
.track-item.active .t-num{color:var(--teal)}
.t-thumb{width:44px;height:26px;border-radius:4px;background:var(--surface3);object-fit:cover;flex-shrink:0;display:block}
.t-info{flex:1;min-width:0}
.t-title{font-size:.72rem;font-weight:600;color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.track-item.active .t-title{color:var(--white)}
.t-sub{font-size:.6rem;color:var(--gray);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bars{display:none;gap:2px;align-items:flex-end;height:10px;flex-shrink:0}
.track-item.active .t-bars{display:flex}
.t-bar{width:2px;background:var(--teal);border-radius:1px;animation:eq .9s ease-in-out infinite}
.t-bar:nth-child(1){height:4px;animation-delay:0s}
.t-bar:nth-child(2){height:8px;animation-delay:.2s}
.t-bar:nth-child(3){height:5px;animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.4)}}

/* MAIN */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

/* PLAYER */
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.player-wrap:fullscreen,.player-wrap:-webkit-full-screen{border-radius:0!important;border:none!important;width:100%!important;height:100%!important;aspect-ratio:unset!important}
#yt-player{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* THUMB COVER */
.thumb-cover{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s}
.thumb-cover.gone{opacity:0;pointer-events:none}
.thumb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;filter:blur(2px)}
.thumb-play{position:relative;z-index:2;width:62px;height:62px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(0,212,170,.5),0 0 80px rgba(0,212,170,.2);transition:transform .2s}
.thumb-cover:hover .thumb-play{transform:scale(1.08)}
.thumb-play svg{width:22px;height:22px;fill:#000;margin-left:3px}

/* SPINNER */
.ld-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:2.5px solid rgba(255,255,255,.06);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;z-index:8;display:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* UI LAYER */
.ui-layer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.08) 38%,transparent 60%)}
.player-wrap:hover .ui-layer,.player-wrap.show-ui .ui-layer{opacity:1}

/* GESTURE */
.gesture{position:absolute;inset:0;z-index:20;pointer-events:auto;cursor:pointer}

/* CENTER BTN */
.center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.72);border:1.5px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s;pointer-events:none;z-index:40;backdrop-filter:blur(8px)}
.center-btn.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.center-btn svg{width:18px;height:18px;fill:#fff}

/* SKIP FLASH */
.skip-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.82);border:1px solid var(--teal);padding:8px 14px;border-radius:24px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;z-index:45;backdrop-filter:blur(8px);transition:all .15s;white-space:nowrap}
.skip-flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.skip-flash svg{width:13px;height:13px;fill:var(--teal)}
.skip-flash span{font-family:'DM Mono',monospace;font-size:.76rem;color:#fff}

/* CONTROLS */
.ctrl-bar{margin-top:auto;padding:0 14px 12px;pointer-events:none;opacity:0;transition:opacity .2s;position:relative;z-index:30}
.ctrl-bar.show{opacity:1;pointer-events:auto}
.prog-wrap{width:100%;height:16px;display:flex;align-items:center;margin-bottom:6px;cursor:pointer}
.prog-track{width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:2px;position:relative;transition:height .15s}
.prog-wrap:hover .prog-track,.prog-wrap.dragging .prog-track{height:4px}
.prog-fill{height:100%;width:0%;background:var(--teal);border-radius:2px;position:relative;box-shadow:0 0 6px rgba(0,212,170,.4)}
.prog-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%) scale(0);width:12px;height:12px;background:var(--teal);border-radius:50%;box-shadow:0 0 0 3px rgba(0,212,170,.25);transition:transform .15s}
.prog-wrap:hover .prog-fill::after,.prog-wrap.dragging .prog-fill::after{transform:translateY(-50%) scale(1)}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;height:28px;gap:3px}
.ctrl-left,.ctrl-right{display:flex;align-items:center;gap:2px}
.ibtn{background:transparent;border:none;color:rgba(255,255,255,.82);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.ibtn:hover{background:rgba(255,255,255,.1);color:var(--teal)}
.ibtn svg{width:15px;height:15px;fill:currentColor}
.time-disp{font-family:'DM Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.82);min-width:90px;padding:0 4px;white-space:nowrap}
.vol-group{display:flex;align-items:center;gap:2px}
.vol-slider{width:52px;height:3px;accent-color:var(--teal);cursor:pointer}
.speed-btn{background:rgba(255,255,255,.08);border:none;color:#fff;font-family:'DM Mono',monospace;font-size:.62rem;font-weight:500;padding:3px 8px;border-radius:4px;cursor:pointer;min-width:32px;text-align:center;transition:all .15s}
.speed-btn:hover{background:var(--teal);color:#000}

/* LECTURE INFO BAR */
.lec-info{background:var(--surface);border-radius:10px;padding:11px 16px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.lec-text h3{font-family:'Cormorant Garamond',serif;font-size:.95rem;font-weight:700;margin-bottom:2px;line-height:1.3;letter-spacing:-.01em}
.lec-meta{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--gray)}
.pdf-row{display:flex;gap:6px;flex-wrap:wrap}
.pdf-btn{display:inline-flex;align-items:center;gap:5px;background:var(--teal);color:#000;text-decoration:none;font-size:.7rem;font-weight:700;padding:6px 12px;border-radius:6px;transition:all .2s;white-space:nowrap;font-family:'Cabinet Grotesk',sans-serif}
.pdf-btn:hover{background:var(--teal2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,212,170,.25)}
.pdf-btn svg{width:12px;height:12px;fill:currentColor}

/* NEXT/PREV OVERLAY */
.nav-overlay{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:0;z-index:35;opacity:0;transition:opacity .2s;pointer-events:none}
.nav-overlay.left{left:12px}
.nav-overlay.right{right:12px}
.player-wrap.show-ui .nav-overlay{opacity:1;pointer-events:auto}
.nav-btn{background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;backdrop-filter:blur(6px);font-family:'Cabinet Grotesk',sans-serif;font-size:.7rem}
.nav-btn:hover{background:rgba(0,212,170,.2);border-color:var(--teal);color:var(--teal)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:14px;height:14px;fill:currentColor}

/* BLOCK RIGHT-CLICK LAYER */
.block-layer{position:absolute;inset:0;z-index:60;pointer-events:none}

@media(max-width:860px){
  .shell{padding:6px 8px 5px;gap:6px}
  .body{flex-direction:column}
  .sidebar{width:100%;height:155px;flex-shrink:0}
  .tbar-center{display:none}
  .vol-slider{width:38px}
  .lec-info{padding:9px 13px}
}
@media(max-width:480px){
  .sidebar{height:130px}
  .time-disp{min-width:70px;font-size:.62rem}
}
</style>
</head>
<body>
<div class="shell">
  <!-- TOP BAR -->
  <div class="tbar">
    <a href="/dashboard.html" class="brand"><div class="brand-dot"></div>Abhy<em>udoy</em></a>
    <div class="tbar-center"><div class="lec-title-bar" id="lTitleBar">Loading…</div></div>
    <div class="tbar-right">
      <a href="" class="back-link" id="backLink">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Course
      </a>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-head">
        <div class="sb-course" id="sbCourse">Loading…</div>
        <div class="sb-count" id="sbCount"></div>
      </div>
      <div class="track-list" id="trackList"></div>
    </div>

    <!-- MAIN COLUMN -->
    <div class="main-col">
      <!-- PLAYER -->
      <div class="player-wrap" id="playerWrap">
        <div id="yt-player"></div>
        <div class="ld-ring" id="ldRing"></div>

        <!-- THUMB COVER -->
        <div class="thumb-cover" id="thumbCover">
          <img src="" id="thumbBg" class="thumb-bg" alt="" draggable="false">
          <div class="thumb-play"><svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg></div>
        </div>

        <!-- UI LAYER -->
        <div class="ui-layer" id="uiLayer">
          <div class="gesture" id="gesture"></div>

          <!-- CENTER BTN -->
          <div class="center-btn" id="centerBtn">
            <svg id="bigPlay" viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
            <svg id="bigPause" viewBox="0 0 10 10" style="display:none"><rect x="1.5" y="1" width="3" height="8"/><rect x="5.5" y="1" width="3" height="8"/></svg>
          </div>

          <!-- SKIP FLASH -->
          <div class="skip-flash" id="skipFlash">
            <svg id="skipIco" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            <span id="skipTxt">+10s</span>
          </div>

          <!-- NAV OVERLAYS -->
          <div class="nav-overlay left">
            <button class="nav-btn" id="prevBtn" onclick="prevLec()" title="Previous lecture">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
          </div>
          <div class="nav-overlay right">
            <button class="nav-btn" id="nextBtn" onclick="nextLec()" title="Next lecture">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>

          <!-- CONTROLS -->
          <div class="ctrl-bar" id="ctrlBar">
            <div class="prog-wrap" id="progWrap">
              <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
            </div>
            <div class="ctrl-row">
              <div class="ctrl-left">
                <button class="ibtn" id="playBtn" onclick="togglePlay()" title="Play/Pause">
                  <svg id="pIco" viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
                  <svg id="paIco" viewBox="0 0 10 10" style="display:none"><rect x="1.5" y="1" width="3" height="8"/><rect x="5.5" y="1" width="3" height="8"/></svg>
                </button>
                <button class="ibtn" onclick="skip(-10)" title="Rewind 10s">
                  <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="ibtn" onclick="skip(10)" title="Forward 10s">
                  <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <span class="time-disp" id="timeDisp">00:00 / 00:00</span>
              </div>
              <div class="ctrl-right">
                <div class="vol-group">
                  <button class="ibtn" id="muteBtn" onclick="toggleMute()" title="Mute">
                    <svg id="volHi" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg id="volMute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                  </button>
                  <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100" oninput="onVolChange(this.value)">
                </div>
                <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()" title="Playback speed">1×</button>
                <button class="ibtn" onclick="toggleFS()" title="Fullscreen">
                  <svg id="fsExp" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                  <svg id="fsCmp" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="block-layer"></div>
      </div><!-- /player-wrap -->

      <!-- LECTURE INFO -->
      <div class="lec-info">
        <div class="lec-text">
          <h3 id="lecTitle">Loading…</h3>
          <div class="lec-meta" id="lecMeta"></div>
        </div>
        <div class="pdf-row" id="pdfRow"></div>
      </div>
    </div><!-- /main-col -->
  </div><!-- /body -->
</div><!-- /shell -->

<script>
const token=localStorage.getItem('abhyudoy_token');
const user=JSON.parse(localStorage.getItem('abhyudoy_user')||'null');
if(!token||!user){window.location.href='/index.html';}

const params=new URLSearchParams(location.search);
const lectureId=params.get('lecture');
const courseId=params.get('course');
if(!lectureId||!courseId){window.location.href='/dashboard.html';}
document.getElementById('backLink').href=`/course.html?id=${courseId}`;

let player,allLec=[],curIdx=0,isDrag=false,hideT,cbT;
const speeds=[0.5,0.75,1,1.25,1.5,1.75,2];let spdIdx=2;

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function fmt(s){if(!s||s<0)return'00:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m<10?'0'+m:m}:${sec<10?'0'+sec:sec}`;}

/* ── INIT ── */
async function init(){
  try{
    const res=await fetch(`/api/user/lecture/${lectureId}`,{headers:{Authorization:'Bearer '+token}});
    if(res.status===401){window.location.href='/index.html';return;}
    if(res.status===403){window.location.href='/dashboard.html';return;}
    const d=await res.json();
    if(d.error){window.location.href='/dashboard.html';return;}

    allLec=d.allLectures||[];
    curIdx=allLec.findIndex(l=>l.id==parseInt(lectureId));
    if(curIdx<0)curIdx=0;

    // Set course name in sidebar
    document.getElementById('sbCourse').textContent=allLec[0]?.subject_name||'Course';
    document.getElementById('sbCount').textContent=`${allLec.length} Lecture${allLec.length!==1?'s':''}`;

    renderLecInfo(d.lecture,d.pdfs||[]);
    document.title=d.lecture.title+' — Abhyudoy';

    // Build sidebar
    buildSidebar();

    // Load YouTube
    loadYTAPI(allLec[curIdx].yt_video_id);
  }catch(e){console.error('Init error:',e);}
}

function buildSidebar(){
  const tl=document.getElementById('trackList');
  tl.innerHTML='';
  allLec.forEach((l,i)=>{
    const div=document.createElement('div');
    div.className='track-item'+(i===curIdx?' active':'');
    div.dataset.idx=i;
    div.innerHTML=`<span class="t-num">${String(i+1).padStart(2,'0')}</span>
      <img class="t-thumb" src="https://img.youtube.com/vi/${esc(l.yt_video_id)}/mqdefault.jpg" alt="" draggable="false" onerror="this.style.display='none'">
      <div class="t-info"><div class="t-title">${esc(l.title)}</div><div class="t-sub">${esc([l.subject_name,l.chapter_title].filter(Boolean).join(' · '))}</div></div>
      <div class="t-bars"><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div></div>`;
    div.addEventListener('click',()=>switchLec(i));
    tl.appendChild(div);
  });
  updateNavBtns();
}

function renderLecInfo(lec,pdfs){
  document.getElementById('lecTitle').textContent=lec.title;
  document.getElementById('lTitleBar').textContent=lec.title;
  document.getElementById('lecMeta').textContent=[lec.subject_name,lec.paper_name,lec.chapter_title].filter(Boolean).join(' · ');
  const pr=document.getElementById('pdfRow');
  pr.innerHTML=pdfs.map(p=>`<a href="${esc(p.pdf_url)}" target="_blank" rel="noopener" class="pdf-btn"><svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1z"/></svg>${esc(p.title)}</a>`).join('');
}

/* ── SWITCH LECTURE ── */
async function switchLec(idx){
  if(idx<0||idx>=allLec.length)return;
  const lec=allLec[idx];curIdx=idx;

  // Update sidebar
  document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  // Scroll item into view
  const items=document.querySelectorAll('.track-item');
  if(items[idx])items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});

  document.getElementById('lecTitle').textContent=lec.title;
  document.getElementById('lTitleBar').textContent=lec.title;
  document.getElementById('lecMeta').textContent=[lec.subject_name,lec.paper_name,lec.chapter_title].filter(Boolean).join(' · ');
  document.getElementById('pdfRow').innerHTML='';
  document.getElementById('thumbBg').src=`https://img.youtube.com/vi/${lec.yt_video_id}/maxresdefault.jpg`;
  document.getElementById('thumbCover').classList.remove('gone');
  document.title=lec.title+' — Abhyudoy';
  history.replaceState({},'',`/player.html?lecture=${lec.id}&course=${courseId}`);
  updateNavBtns();

  // Load player
  if(player?.cueVideoById){player.cueVideoById(lec.yt_video_id);}
  else if(player?.loadVideoById){player.loadVideoById(lec.yt_video_id);}

  // Fetch PDFs
  try{
    const res=await fetch(`/api/user/lecture/${lec.id}`,{headers:{Authorization:'Bearer '+token}});
    if(res.ok){const dd=await res.json();renderLecInfo(dd.lecture,dd.pdfs||[]);}
  }catch{}
}

function prevLec(){if(curIdx>0)switchLec(curIdx-1);}
function nextLec(){if(curIdx<allLec.length-1)switchLec(curIdx+1);}
function updateNavBtns(){
  document.getElementById('prevBtn').disabled=curIdx<=0;
  document.getElementById('nextBtn').disabled=curIdx>=allLec.length-1;
}

/* ── YOUTUBE API ── */
function loadYTAPI(videoId){
  if(window.YT&&window.YT.Player){createPlayer(videoId);return;}
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>createPlayer(videoId);
}

function createPlayer(videoId){
  if(player){player.destroy();}
  player=new YT.Player('yt-player',{
    height:'100%',width:'100%',videoId,
    playerVars:{autoplay:0,controls:0,rel:0,modestbranding:1,iv_load_policy:3,fs:0,disablekb:1,playsinline:1,showinfo:0,origin:location.origin,cc_load_policy:0},
    events:{
      onReady:()=>{
        document.getElementById('thumbBg').src=`https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
        player.setVolume(100);
        requestAnimationFrame(tick);
      },
      onStateChange:(e)=>{
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){
          document.getElementById('thumbCover').classList.add('gone');
          setPlaying(true);
          document.getElementById('ldRing').style.display='none';
          showUI();
        }else if(e.data===S.PAUSED){
          setPlaying(false);showUI();
          document.getElementById('centerBtn').classList.add('show');
        }else if(e.data===S.BUFFERING){
          document.getElementById('ldRing').style.display='block';
        }else if(e.data===S.ENDED){
          setPlaying(false);
          if(curIdx<allLec.length-1)setTimeout(()=>switchLec(curIdx+1),1000);
        }
      }
    }
  });
}

/* ── TICK ── */
function tick(){
  if(player?.getCurrentTime&&!isDrag){
    const cur=player.getCurrentTime()||0,dur=player.getDuration()||1;
    const pct=(cur/dur)*100;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('timeDisp').textContent=`${fmt(cur)} / ${fmt(dur)}`;
  }
  requestAnimationFrame(tick);
}

/* ── PLAY STATE ── */
function setPlaying(p){
  document.getElementById('pIco').style.display=p?'none':'block';
  document.getElementById('paIco').style.display=p?'block':'none';
  document.getElementById('bigPlay').style.display=p?'none':'block';
  document.getElementById('bigPause').style.display=p?'block':'none';
}
function togglePlay(){if(!player)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo();}

/* ── SKIP ── */
function skip(s){
  if(!player)return;
  player.seekTo((player.getCurrentTime()||0)+s,true);
  const sf=document.getElementById('skipFlash');
  const ico=document.getElementById('skipIco');
  document.getElementById('skipTxt').textContent=s<0?`${s}s`:`+${s}s`;
  // Forward icon
  ico.innerHTML=s<0?'<path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>':'<path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>';
  sf.classList.add('show');clearTimeout(window._st);window._st=setTimeout(()=>sf.classList.remove('show'),700);
}

/* ── SEEK ── */
function seekTo(cx){
  const rect=document.getElementById('progTrack').getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
  if(player)player.seekTo(pct*(player.getDuration()||0),true);
}

/* ── UI SHOW/HIDE ── */
function showUI(){
  const pw=document.getElementById('playerWrap'),cb=document.getElementById('ctrlBar');
  pw.classList.add('show-ui');cb.classList.add('show');
  clearTimeout(hideT);clearTimeout(cbT);
  if(!isDrag)hideT=setTimeout(()=>{
    if(player?.getPlayerState()===YT.PlayerState.PLAYING){
      pw.classList.remove('show-ui');cb.classList.remove('show');
      document.getElementById('centerBtn').classList.remove('show');
    }
  },4000);
}

/* ── VOLUME ── */
function onVolChange(v){
  if(!player)return;player.setVolume(+v);
  document.getElementById('volHi').style.display=(+v===0)?'none':'block';
  document.getElementById('volMute').style.display=(+v===0)?'block':'none';
}
function toggleMute(){
  if(!player)return;
  if(player.isMuted()){player.unMute();const v=player.getVolume();document.getElementById('volSlider').value=v;document.getElementById('volHi').style.display='block';document.getElementById('volMute').style.display='none';}
  else{player.mute();document.getElementById('volSlider').value=0;document.getElementById('volHi').style.display='none';document.getElementById('volMute').style.display='block';}
}

/* ── SPEED ── */
function cycleSpeed(){
  spdIdx=(spdIdx+1)%speeds.length;
  if(player)player.setPlaybackRate(speeds[spdIdx]);
  document.getElementById('speedBtn').textContent=speeds[spdIdx]+'×';
}

/* ── FULLSCREEN ── */
function toggleFS(){
  if(!document.fullscreenElement){
    document.getElementById('playerWrap').requestFullscreen().catch(()=>{});
    document.getElementById('fsExp').style.display='none';
    document.getElementById('fsCmp').style.display='block';
  }else{
    document.exitFullscreen();
    document.getElementById('fsExp').style.display='block';
    document.getElementById('fsCmp').style.display='none';
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement){document.getElementById('fsExp').style.display='block';document.getElementById('fsCmp').style.display='none';}
});

/* ── EVENTS ── */
const pw=document.getElementById('playerWrap');
pw.addEventListener('mousemove',()=>{showUI();if(player?.getPlayerState()===YT.PlayerState.PAUSED)document.getElementById('centerBtn').classList.add('show');});
pw.addEventListener('mouseleave',()=>{if(!isDrag){pw.classList.remove('show-ui');document.getElementById('centerBtn').classList.remove('show');}});

document.getElementById('gesture').addEventListener('click',e=>{
  if(e.target.closest('.ctrl-bar')||e.target.closest('.nav-overlay'))return;
  togglePlay();showUI();
  document.getElementById('centerBtn').classList.add('show');
  clearTimeout(cbT);cbT=setTimeout(()=>{if(player?.getPlayerState()===YT.PlayerState.PLAYING)document.getElementById('centerBtn').classList.remove('show');},3500);
});
document.getElementById('centerBtn').addEventListener('click',e=>{e.stopPropagation();togglePlay();});
document.getElementById('thumbCover').addEventListener('click',()=>{document.getElementById('thumbCover').classList.add('gone');player?.playVideo();});

// Progress drag
const pgWrap=document.getElementById('progWrap');
pgWrap.addEventListener('mousedown',e=>{isDrag=true;pgWrap.classList.add('dragging');seekTo(e.clientX);});
document.addEventListener('mousemove',e=>{if(isDrag)seekTo(e.clientX);});
document.addEventListener('mouseup',()=>{if(isDrag){isDrag=false;pgWrap.classList.remove('dragging');}});
pgWrap.addEventListener('touchstart',()=>{isDrag=true;pgWrap.classList.add('dragging');},{passive:true});
pgWrap.addEventListener('touchmove',e=>{if(isDrag){e.preventDefault();seekTo(e.touches[0].clientX);}},{passive:false});
pgWrap.addEventListener('touchend',()=>{isDrag=false;pgWrap.classList.remove('dragging');});

// Double-tap mobile
let lastTap=0;
document.getElementById('gesture').addEventListener('touchend',e=>{
  e.preventDefault();
  const now=Date.now(),gap=now-lastTap;
  if(gap<280&&gap>0){
    const x=e.changedTouches[0].clientX,w=window.innerWidth;
    if(x<w*.35)skip(-10);else if(x>w*.65)skip(10);else togglePlay();
  }else{
    showUI();document.getElementById('centerBtn').classList.add('show');
    clearTimeout(cbT);cbT=setTimeout(()=>{if(player?.getPlayerState()===YT.PlayerState.PLAYING)document.getElementById('centerBtn').classList.remove('show');},3500);
  }
  lastTap=now;
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  switch(e.code){
    case'Space':e.preventDefault();togglePlay();break;
    case'ArrowLeft':e.preventDefault();skip(-10);break;
    case'ArrowRight':e.preventDefault();skip(10);break;
    case'ArrowUp':e.preventDefault();if(player){const v=Math.min((player.getVolume()||0)+5,100);player.setVolume(v);document.getElementById('volSlider').value=v;}break;
    case'ArrowDown':e.preventDefault();if(player){const v=Math.max((player.getVolume()||0)-5,0);player.setVolume(v);document.getElementById('volSlider').value=v;}break;
    case'KeyF':toggleFS();break;
    case'KeyM':toggleMute();break;
    case'KeyN':nextLec();break;
    case'KeyP':prevLec();break;
    case'Comma':if(spdIdx>0){spdIdx--;if(player)player.setPlaybackRate(speeds[spdIdx]);document.getElementById('speedBtn').textContent=speeds[spdIdx]+'×';}break;
    case'Period':if(spdIdx<speeds.length-1){spdIdx++;if(player)player.setPlaybackRate(speeds[spdIdx]);document.getElementById('speedBtn').textContent=speeds[spdIdx]+'×';}break;
  }
});

// Prevent context menu on player
document.addEventListener('contextmenu',e=>{if(e.target.closest('.player-wrap'))e.preventDefault();});
document.addEventListener('dragstart',e=>{if(e.target.closest('.player-wrap'))e.preventDefault();});
pw.addEventListener('selectstart',e=>e.preventDefault());

init();
</script>
