<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lecture — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.1);
  --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;--red:#f0566a;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--white);overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

.shell{display:flex;flex-direction:column;height:100vh;padding:12px 16px 10px;gap:10px;max-width:1440px;margin:0 auto}

.tbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:38px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white)}
.brand img{height:26px;flex-shrink:0}
.back-btn{color:var(--gray);text-decoration:none;font-size:0.74rem;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:5px}
.back-btn:hover{color:var(--teal)}
.back-btn svg{width:14px;height:14px}

.body{display:flex;gap:12px;flex:1;min-height:0}

.sidebar{width:280px;flex-shrink:0;background:var(--surface);border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-head h2{font-family:'Cormorant Garamond',serif;font-size:0.92rem;font-weight:700;margin-bottom:2px;letter-spacing:-0.01em}
.sb-head p{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--gray)}
.track-list{flex:1;overflow-y:auto;padding:6px}

.track-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:2px}
.track-item:hover{background:var(--surface2)}
.track-item.active{background:var(--teal-dim);border-color:rgba(0,212,170,0.18)}
.t-num{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--gray);width:18px;text-align:center;flex-shrink:0}
.track-item.active .t-num{color:var(--teal)}
.t-thumb{width:46px;height:28px;border-radius:4px;background:var(--surface2);object-fit:cover;flex-shrink:0}
.t-info{flex:1;min-width:0}
.t-title{font-size:0.72rem;font-weight:600;color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.track-item.active .t-title{color:var(--white)}
.t-sub{font-size:0.6rem;color:var(--gray);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
#yt-player{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

.thumb-cover{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s}
.thumb-cover.gone{opacity:0;pointer-events:none}
.thumb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;filter:blur(2px)}
.thumb-play{position:relative;z-index:2;width:64px;height:64px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(0,212,170,0.5);transition:transform .2s}
.thumb-cover:hover .thumb-play{transform:scale(1.08)}
.thumb-play svg{width:22px;height:22px;fill:#000;margin-left:3px}

.ld-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border:2.5px solid rgba(255,255,255,0.06);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;z-index:8;display:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.ui-layer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.1) 35%,transparent 60%)}
.player-wrap:hover .ui-layer,.player-wrap.show-ui .ui-layer{opacity:1}

.gesture{position:absolute;inset:0;z-index:20;pointer-events:auto;cursor:pointer}

.center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,0.72);border:1.5px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s;pointer-events:none;z-index:40;backdrop-filter:blur(8px)}
.center-btn.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.center-btn svg{width:18px;height:18px;fill:#fff}

.skip-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);background:rgba(0,0,0,0.8);border:1px solid var(--teal);padding:8px 14px;border-radius:24px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;z-index:45;backdrop-filter:blur(8px);transition:all .15s;white-space:nowrap}
.skip-flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.skip-flash svg{width:13px;height:13px;fill:var(--teal)}
.skip-flash span{font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:500;color:#fff}

.ctrl-bar{margin-top:auto;padding:0 14px 12px;pointer-events:none;opacity:0;transition:opacity .2s;position:relative;z-index:30}
.ctrl-bar.show{opacity:1;pointer-events:auto}

.prog-wrap{width:100%;height:16px;display:flex;align-items:center;margin-bottom:6px;cursor:pointer}
.prog-track{width:100%;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;position:relative;transition:height .15s}
.prog-wrap:hover .prog-track{height:4px}
.prog-fill{height:100%;width:0%;background:var(--teal);border-radius:2px;position:relative;box-shadow:0 0 6px rgba(0,212,170,0.4)}
.prog-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%) scale(0);width:12px;height:12px;background:var(--teal);border-radius:50%;box-shadow:0 0 0 3px rgba(0,212,170,0.2);transition:transform .15s}
.prog-wrap:hover .prog-fill::after,.prog-wrap.dragging .prog-fill::after{transform:translateY(-50%) scale(1)}

.ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ctrl-left,.ctrl-right{display:flex;align-items:center;gap:3px}
.ibtn{background:transparent;border:none;color:rgba(255,255,255,0.82);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.ibtn:hover{background:rgba(255,255,255,0.1);color:var(--teal)}
.ibtn svg{width:14px;height:14px;fill:currentColor}
.time-disp{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:rgba(255,255,255,0.82);min-width:88px;padding:0 4px}
.vol-group{display:flex;align-items:center;gap:2px}
.vol-slider{width:54px;height:3px;accent-color:var(--teal);cursor:pointer}
.speed-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;font-family:'JetBrains Mono',monospace;font-size:0.64rem;font-weight:500;padding:3px 8px;border-radius:4px;cursor:pointer;min-width:34px;text-align:center;transition:all .15s}
.speed-btn:hover{background:var(--teal);color:#000}

.lec-info{background:var(--surface);border-radius:10px;padding:12px 16px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.lec-text h3{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700;margin-bottom:2px;letter-spacing:-0.01em;line-height:1.3}
.lec-text p{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--gray)}

.lec-attachments{display:flex;gap:6px;flex-wrap:wrap}
.lec-pdf-btn{display:inline-flex;align-items:center;gap:5px;background:var(--teal);color:#000;text-decoration:none;font-size:0.7rem;font-weight:700;padding:6px 12px;border-radius:6px;transition:all .2s;white-space:nowrap}
.lec-pdf-btn:hover{background:var(--teal2);transform:translateY(-1px)}
.lec-pdf-btn svg{width:12px;height:12px}
.lec-link-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;color:var(--teal);text-decoration:none;font-size:0.7rem;font-weight:600;padding:6px 12px;border-radius:6px;border:1.5px solid rgba(0,212,170,0.3);transition:all .2s;white-space:nowrap}
.lec-link-btn:hover{background:var(--teal-dim);border-color:var(--teal)}
.lec-link-btn svg{width:12px;height:12px}

.block-layer{position:absolute;inset:0;z-index:60;pointer-events:none}

@media(max-width:860px){
  .shell{padding:8px 10px 6px;gap:6px}
  .body{flex-direction:column}
  .sidebar{width:100%;height:160px}
  .vol-slider{width:40px}
  .lec-info{padding:10px 14px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="tbar">
    <a href="/dashboard.html" class="brand">
      <img src="/images/reallogo.png" height="26" alt="Abhyudoy">
    </a>
    <a href="" class="back-btn" id="backLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Course
    </a>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sb-head"><h2>Lectures</h2><p id="sbCount">Loading...</p></div>
      <div class="track-list" id="trackList"></div>
    </div>

    <div class="main">
      <div class="player-wrap" id="playerWrap">
        <div id="yt-player"></div>
        <div class="ld-ring" id="ldRing"></div>
        <div class="thumb-cover" id="thumbCover">
          <img src="" id="thumbBg" class="thumb-bg" alt="" draggable="false">
          <div class="thumb-play"><svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg></div>
        </div>
        <div class="ui-layer" id="uiLayer">
          <div class="gesture" id="gesture"></div>
          <div class="center-btn" id="centerBtn">
            <svg id="bigPlay" viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
            <svg id="bigPause" viewBox="0 0 10 10" style="display:none"><rect x="1.5" y="1" width="3" height="8"/><rect x="5.5" y="1" width="3" height="8"/></svg>
          </div>
          <div class="skip-flash" id="skipFlash">
            <svg viewBox="0 0 24 24"><path d="M18 13.35V4.87l-7.94 4.24L18 13.35zm0 5.15H6V8L4.5 6.5 3.35 7.65 5 9.3V22h13v-3.5zm-2-1.5H8v-2h8v2zM4 6H2V4h2V2h2v2h2v2H8v2H6V8H4V6z"/></svg>
            <span id="skipTxt">+10s</span>
          </div>
          <div class="ctrl-bar" id="ctrlBar">
            <div class="prog-wrap" id="progWrap">
              <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
            </div>
            <div class="ctrl-row">
              <div class="ctrl-left">
                <button class="ibtn" id="playBtn">
                  <svg id="pIco" viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
                  <svg id="paIco" viewBox="0 0 10 10" style="display:none"><rect x="1.5" y="1" width="3" height="8"/><rect x="5.5" y="1" width="3" height="8"/></svg>
                </button>
                <button class="ibtn" id="rewBtn" title="-10s">
                  <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="ibtn" id="fwdBtn" title="+10s">
                  <svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zm-.5 6L9 6v12z"/></svg>
                </button>
                <span class="time-disp" id="timeDisp">00:00 / 00:00</span>
              </div>
              <div class="ctrl-right">
                <div class="vol-group">
                  <button class="ibtn" id="muteBtn">
                    <svg id="volHi" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg id="volMute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                  </button>
                  <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100">
                </div>
                <button class="speed-btn" id="speedBtn">1x</button>
                <button class="ibtn" id="fsBtn" title="Fullscreen">
                  <svg id="fsExp" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                  <svg id="fsCmp" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="block-layer"></div>
      </div>

      <div class="lec-info">
        <div class="lec-text"><h3 id="lecTitle">Loading...</h3><p id="lecMeta"></p></div>
        <div class="lec-attachments" id="lecAttachments"></div>
      </div>
    </div>
  </div>
</div>

<script>
var token = localStorage.getItem('abhyudoy_token');
var user = JSON.parse(localStorage.getItem('abhyudoy_user') || 'null');
if (!token || !user) { window.location.href = '/index.html'; }

var params = new URLSearchParams(location.search);
var lectureId = params.get('lecture');
var courseId = params.get('course');
if (!lectureId || !courseId) { window.location.href = '/dashboard.html'; }

document.getElementById('backLink').href = '/course.html?id=' + courseId;

var player, allLec = [], curIdx = 0, isDrag = false, hideT, cbT;
var speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
var spdIdx = 2;

function fmt(s) {
  if (!s || s < 0) return '00:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
}

function esc(s) { var d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

async function init() {
  try {
    var res = await fetch('/api/user/lecture/' + lectureId, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) { window.location.href = '/dashboard.html'; return; }

    var d = await res.json();
    allLec = d.allLectures || [];
    curIdx = allLec.findIndex(function(l) { return l.id === parseInt(lectureId); });
    if (curIdx < 0) curIdx = 0;

    renderLecInfo(d.lecture, d.pdfs || [], d.links || []);
    document.getElementById('sbCount').textContent = allLec.length + ' Lectures';
    document.title = d.lecture.title + ' — Abhyudoy';

    var tl = document.getElementById('trackList');
    tl.innerHTML = '';

    for (var i = 0; i < allLec.length; i++) {
      var l = allLec[i];
      var div = document.createElement('div');
      div.className = 'track-item' + (i === curIdx ? ' active' : '');
      div.innerHTML = '<span class="t-num">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<img class="t-thumb" src="https://img.youtube.com/vi/' + l.yt_video_id + '/mqdefault.jpg" alt="" draggable="false" onerror="this.style.display=\'none\'">' +
        '<div class="t-info"><div class="t-title">' + esc(l.title) + '</div><div class="t-sub">' + esc(l.chapter_title || '') + '</div></div>';
      div.addEventListener('click', (function(idx) { return function() { switchLec(idx); }; })(i));
      tl.appendChild(div);
    }

    loadYTApi(allLec[curIdx].yt_video_id);
  } catch (e) { console.error(e); }
}

function renderLecInfo(lec, pdfs, links) {
  document.getElementById('lecTitle').textContent = lec.title;
  document.getElementById('lecMeta').textContent = [lec.subject_name, lec.paper_name, lec.chapter_title].filter(Boolean).join(' · ');

  var attachmentsHtml = '';

  if (pdfs && pdfs.length) {
    for (var i = 0; i < pdfs.length; i++) {
      attachmentsHtml += '<a href="' + esc(pdfs[i].pdf_url) + '" target="_blank" rel="noopener" class="lec-pdf-btn">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
        esc(pdfs[i].title) + '</a>';
    }
  }

  if (links && links.length) {
    for (var j = 0; j < links.length; j++) {
      attachmentsHtml += '<a href="' + esc(links[j].url) + '" target="_blank" rel="noopener" class="lec-link-btn">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>' +
        esc(links[j].title) + '</a>';
    }
  }

  document.getElementById('lecAttachments').innerHTML = attachmentsHtml;
}

async function switchLec(idx) {
  if (idx < 0 || idx >= allLec.length) return;
  var lec = allLec[idx];
  curIdx = idx;

  document.getElementById('lecTitle').textContent = lec.title;
  document.getElementById('lecMeta').textContent = [lec.subject_name, lec.paper_name, lec.chapter_title].filter(Boolean).join(' · ');
  document.getElementById('lecAttachments').innerHTML = '';
  document.getElementById('thumbBg').src = 'https://img.youtube.com/vi/' + lec.yt_video_id + '/maxresdefault.jpg';
  document.getElementById('thumbCover').classList.remove('gone');

  var items = document.querySelectorAll('.track-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', i === idx);
  }

  history.replaceState({}, '', '/player.html?lecture=' + lec.id + '&course=' + courseId);
  document.title = lec.title + ' — Abhyudoy';

  if (player && player.cueVideoById) player.cueVideoById(lec.yt_video_id);

  try {
    var res = await fetch('/api/user/lecture/' + lec.id, { headers: { 'Authorization': 'Bearer ' + token } });
    var d = await res.json();
    renderLecInfo(d.lecture, d.pdfs || [], d.links || []);
  } catch (e) {}

  if (items[idx]) items[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function loadYTApi(videoId) {
  if (window.YT && window.YT.Player) { createPlayer(videoId); return; }
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady = function() { createPlayer(videoId); };
}

function createPlayer(videoId) {
  if (player) player.destroy();
  player = new YT.Player('yt-player', {
    height: '100%', width: '100%', videoId: videoId,
    playerVars: { autoplay: 0, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0, disablekb: 1, playsinline: 1, showinfo: 0, origin: location.origin },
    events: {
      onReady: function() {
        document.getElementById('thumbBg').src = 'https://img.youtube.com/vi/' + videoId + '/maxresdefault.jpg';
        player.setVolume(100);
        requestAnimationFrame(tick);
      },
      onStateChange: function(e) {
        var S = YT.PlayerState;
        if (e.data === S.PLAYING) { document.getElementById('thumbCover').classList.add('gone'); setPlaying(true); document.getElementById('ldRing').style.display = 'none'; showUI(); }
        else if (e.data === S.PAUSED) { setPlaying(false); showUI(); document.getElementById('centerBtn').classList.add('show'); }
        else if (e.data === S.BUFFERING) { document.getElementById('ldRing').style.display = 'block'; }
        else if (e.data === S.ENDED) { setPlaying(false); if (curIdx < allLec.length - 1) setTimeout(function() { switchLec(curIdx + 1); }, 1200); }
      }
    }
  });
}

function tick() {
  if (player && player.getCurrentTime && !isDrag) {
    var cur = player.getCurrentTime() || 0;
    var dur = player.getDuration() || 1;
    document.getElementById('progFill').style.width = ((cur / dur) * 100) + '%';
    document.getElementById('timeDisp').textContent = fmt(cur) + ' / ' + fmt(dur);
  }
  requestAnimationFrame(tick);
}

function setPlaying(p) {
  document.getElementById('pIco').style.display = p ? 'none' : 'block';
  document.getElementById('paIco').style.display = p ? 'block' : 'none';
  document.getElementById('bigPlay').style.display = p ? 'none' : 'block';
  document.getElementById('bigPause').style.display = p ? 'block' : 'none';
}

function togglePlay() { if (!player) return; player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo(); }
function skip(s) { if (!player) return; player.seekTo((player.getCurrentTime() || 0) + s, true); var sf = document.getElementById('skipFlash'); document.getElementById('skipTxt').textContent = s < 0 ? s + 's' : '+' + s + 's'; sf.classList.add('show'); clearTimeout(window._st); window._st = setTimeout(function() { sf.classList.remove('show'); }, 700); }
function seekTo(cx) { var rect = document.getElementById('progFill').parentElement.getBoundingClientRect(); var pct = Math.max(0, Math.min(1, (cx - rect.left) / rect.width)); if (player) player.seekTo(pct * (player.getDuration() || 0), true); }
function showUI() { var pw = document.getElementById('playerWrap'); var cb = document.getElementById('ctrlBar'); pw.classList.add('show-ui'); cb.classList.add('show'); clearTimeout(hideT); clearTimeout(cbT); if (!isDrag) hideT = setTimeout(function() { if (player && player.getPlayerState() === YT.PlayerState.PLAYING) { pw.classList.remove('show-ui'); cb.classList.remove('show'); document.getElementById('centerBtn').classList.remove('show'); } }, 4000); }

document.getElementById('playerWrap').addEventListener('mousemove', function() { showUI(); if (player && player.getPlayerState() === YT.PlayerState.PAUSED) document.getElementById('centerBtn').classList.add('show'); });
document.getElementById('playerWrap').addEventListener('mouseleave', function() { document.getElementById('centerBtn').classList.remove('show'); if (!isDrag) document.getElementById('playerWrap').classList.remove('show-ui'); });
document.getElementById('gesture').addEventListener('click', function(e) { if (e.target.closest('.ctrl-bar')) return; togglePlay(); showUI(); document.getElementById('centerBtn').classList.add('show'); clearTimeout(cbT); cbT = setTimeout(function() { if (player && player.getPlayerState() === YT.PlayerState.PLAYING) document.getElementById('centerBtn').classList.remove('show'); }, 3500); });
document.getElementById('centerBtn').addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); });
document.getElementById('playBtn').addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); });
document.getElementById('rewBtn').addEventListener('click', function(e) { e.stopPropagation(); skip(-10); });
document.getElementById('fwdBtn').addEventListener('click', function(e) { e.stopPropagation(); skip(10); });
document.getElementById('thumbCover').addEventListener('click', function() { document.getElementById('thumbCover').classList.add('gone'); if (player) player.playVideo(); });

document.getElementById('volSlider').addEventListener('input', function(e) { if (!player) return; var v = +e.target.value; player.setVolume(v); document.getElementById('volHi').style.display = v ? 'block' : 'none'; document.getElementById('volMute').style.display = v ? 'none' : 'block'; });
document.getElementById('muteBtn').addEventListener('click', function(e) { e.stopPropagation(); if (!player) return; if (player.isMuted()) { player.unMute(); var v = player.getVolume(); document.getElementById('volSlider').value = v; document.getElementById('volHi').style.display = 'block'; document.getElementById('volMute').style.display = 'none'; } else { player.mute(); document.getElementById('volSlider').value = 0; document.getElementById('volHi').style.display = 'none'; document.getElementById('volMute').style.display = 'block'; } });
document.getElementById('speedBtn').addEventListener('click', function(e) { e.stopPropagation(); spdIdx = (spdIdx + 1) % speeds.length; if (player) player.setPlaybackRate(speeds[spdIdx]); document.getElementById('speedBtn').textContent = speeds[spdIdx] + 'x'; });
document.getElementById('fsBtn').addEventListener('click', function(e) { e.stopPropagation(); if (!document.fullscreenElement) { document.getElementById('playerWrap').requestFullscreen().catch(function() {}); document.getElementById('fsExp').style.display = 'none'; document.getElementById('fsCmp').style.display = 'block'; } else { document.exitFullscreen(); document.getElementById('fsExp').style.display = 'block'; document.getElementById('fsCmp').style.display = 'none'; } });
document.addEventListener('fullscreenchange', function() { if (!document.fullscreenElement) { document.getElementById('fsExp').style.display = 'block'; document.getElementById('fsCmp').style.display = 'none'; } });

var pw = document.getElementById('progWrap');
pw.addEventListener('mousedown', function(e) { isDrag = true; pw.classList.add('dragging'); seekTo(e.clientX); });
document.addEventListener('mousemove', function(e) { if (isDrag) seekTo(e.clientX); });
document.addEventListener('mouseup', function() { if (isDrag) { isDrag = false; pw.classList.remove('dragging'); } });
pw.addEventListener('touchstart', function() { isDrag = true; pw.classList.add('dragging'); }, { passive: true });
pw.addEventListener('touchmove', function(e) { if (isDrag) { e.preventDefault(); seekTo(e.touches[0].clientX); } }, { passive: false });
pw.addEventListener('touchend', function() { isDrag = false; pw.classList.remove('dragging'); });

var lastTap = 0;
document.getElementById('gesture').addEventListener('touchend', function(e) {
  e.preventDefault();
  var now = Date.now();
  var gap = now - lastTap;
  if (gap < 280 && gap > 0) {
    var x = e.changedTouches[0].clientX;
    var w = window.innerWidth;
    if (x < w * 0.35) skip(-10);
    else if (x > w * 0.65) skip(10);
    else togglePlay();
  } else {
    showUI();
    document.getElementById('centerBtn').classList.add('show');
    clearTimeout(cbT);
    cbT = setTimeout(function() { if (player && player.getPlayerState() === YT.PlayerState.PLAYING) document.getElementById('centerBtn').classList.remove('show'); }, 3500);
  }
  lastTap = now;
});

document.addEventListener('keydown', function(e) {
  if (['INPUT', 'TEXTAREA'].indexOf(e.target.tagName) !== -1) return;
  switch (e.code) {
    case 'Space': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); skip(-10); break;
    case 'ArrowRight': e.preventDefault(); skip(10); break;
    case 'ArrowUp': e.preventDefault(); if (player) { var v = Math.min((player.getVolume() || 0) + 5, 100); player.setVolume(v); document.getElementById('volSlider').value = v; } break;
    case 'ArrowDown': e.preventDefault(); if (player) { var v = Math.max((player.getVolume() || 0) - 5, 0); player.setVolume(v); document.getElementById('volSlider').value = v; } break;
    case 'KeyF': document.getElementById('fsBtn').click(); break;
    case 'KeyM': document.getElementById('muteBtn').click(); break;
    case 'KeyN': if (curIdx < allLec.length - 1) switchLec(curIdx + 1); break;
    case 'KeyP': if (curIdx > 0) switchLec(curIdx - 1); break;
  }
});

document.addEventListener('contextmenu', function(e) { if (e.target.closest('.player-wrap')) e.preventDefault(); });
document.addEventListener('dragstart', function(e) { if (e.target.closest('.player-wrap')) e.preventDefault(); });
document.getElementById('playerWrap').addEventListener('selectstart', function(e) { e.preventDefault(); });

init();
</script>
</body>
</html>
