<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Abhyudoy</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d13;--surface:#111620;--surface2:#161c28;--border:rgba(255,255,255,0.06);--teal:#00e5c3;--teal-dim:rgba(0,229,195,0.08);--white:#fff;--gray:#8a95a8;--red:#ff4757;--green:#2ed573;--orange:#f59e0b;--radius:10px;--sw:240px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);display:flex;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08)}

.sidebar{width:var(--sw);background:#0a0e14;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sidebar-top{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;color:var(--teal);text-decoration:none;letter-spacing:-.02em}
.sidebar-logo span{color:var(--white)}
.sidebar-badge{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);margin-top:3px;font-family:'DM Mono',monospace}
.nav-section{padding:4px 0}
.nav-label{font-size:.56rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,0.18);font-weight:700;padding:8px 16px 2px;font-family:'DM Mono',monospace}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:.76rem;font-weight:500;color:rgba(255,255,255,0.4);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;border-left:2px solid transparent;font-family:'DM Sans',sans-serif}
.nav-item:hover{color:var(--white);background:rgba(255,255,255,0.02)}
.nav-item.active{color:var(--teal);background:var(--teal-dim);border-left-color:var(--teal)}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-footer .email{font-size:.68rem;color:var(--gray);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--gray);border-radius:5px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:52px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem}
.menu-btn{display:none;background:none;border:none;color:var(--white);font-size:1.2rem;cursor:pointer;padding:4px}
.btn-view-site{padding:5px 12px;border:1px solid var(--border);color:var(--gray);border-radius:16px;font-size:.68rem;text-decoration:none}
.btn-view-site:hover{border-color:var(--teal);color:var(--teal)}
.content{padding:20px;flex:1}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px}
.stat-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);font-weight:700;margin-bottom:4px;font-family:'DM Mono',monospace}
.stat-val{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--teal)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}

.btn{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:600;padding:7px 14px;border-radius:5px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;letter-spacing:.03em;text-transform:uppercase}
.btn-teal{background:var(--teal);color:#000}.btn-teal:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-red{background:rgba(255,71,87,0.08);color:var(--red);border:1px solid rgba(255,71,87,.12)}.btn-red:hover{background:var(--red);color:#fff}
.btn-green{background:rgba(46,213,115,0.08);color:var(--green);border:1px solid rgba(46,213,115,.12)}.btn-green:hover{background:var(--green);color:#fff}
.btn-xs{padding:3px 6px;font-size:.6rem;border-radius:3px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:8px 10px;text-align:left;font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);font-weight:700;background:var(--surface2);border-bottom:2px solid var(--border);white-space:nowrap;font-family:'DM Mono',monospace}
td{padding:8px 10px;font-size:.76rem;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(255,255,255,0.01)}
.badge{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:10px;display:inline-block;font-family:'DM Mono',monospace}
.badge-teal{background:var(--teal-dim);color:var(--teal)}
.badge-red{background:rgba(255,71,87,0.08);color:var(--red)}
.empty{text-align:center;padding:40px;color:var(--gray);font-size:.8rem}

.form-group{margin-bottom:12px}
.form-label{display:block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);margin-bottom:4px;font-family:'DM Mono',monospace}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:.82rem;color:var(--white);outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--teal)}
.form-select{cursor:pointer}
.form-textarea{resize:vertical;min-height:60px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal-overlay.open{display:grid}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:500px;width:100%;max-height:85vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;font-size:1.1rem}.modal-close:hover{color:var(--red)}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}
.alert{padding:8px 12px;border-radius:5px;font-size:.74rem;margin-bottom:10px;display:none}
.alert.show{display:block}
.alert-error{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,.15);color:var(--red)}
.alert-success{background:rgba(46,213,115,0.08);border:1px solid rgba(46,213,115,.15);color:var(--green)}

@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-btn{display:block}.content{padding:14px}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-top"><a href="/admin.html" class="sidebar-logo">Abhy<span>udoy</span></a><div class="sidebar-badge">Admin Panel</div></div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <button class="nav-item active" data-view="dashboard">📊 Dashboard</button>
    <button class="nav-item" data-view="courses">📚 Courses</button>
    <button class="nav-item" data-view="subjects">📖 Subjects</button>
    <button class="nav-item" data-view="papers">📄 Papers</button>
    <button class="nav-item" data-view="chapters">📑 Chapters</button>
    <button class="nav-item" data-view="lectures">🎬 Lectures</button>
    <button class="nav-item" data-view="resources">📎 Resources</button>
  </div>
  <div class="nav-section">
    <div class="nav-label">Users</div>
    <button class="nav-item" data-view="users">👥 Users</button>
    <button class="nav-item" data-view="memberships">⭐ Memberships</button>
  </div>
  <div class="sidebar-footer"><div class="email" id="adminEmail"></div><button class="btn-logout" onclick="logout()">Sign Out</button></div>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span class="topbar-title" id="topbarTitle">Dashboard</span>
    </div>
    <a href="/dashboard.html" target="_blank" class="btn-view-site">View Site →</a>
  </div>
  <div class="content" id="contentArea"></div>
</main>

<div class="modal-overlay" id="genModal" onclick="if(event.target===this)closeGenModal()">
  <div class="modal"><div class="modal-head"><h3 id="genModalTitle">Modal</h3><button class="modal-close" onclick="closeGenModal()">✕</button></div>
  <div class="modal-body" id="genModalBody"></div>
  <div class="modal-footer" id="genModalFooter"></div></div>
</div>

<script>
const token=localStorage.getItem('abhyudoy_token');
const user=JSON.parse(localStorage.getItem('abhyudoy_user')||'null');
if(!token||!user||user.role!=='admin'){window.location.href='/index.html';}
document.getElementById('adminEmail').textContent=user.email;

let allCourses=[],allSubjects=[],allPapers=[],allChapters=[],allUsers=[];

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}};
  if(body)opts.body=JSON.stringify(body);
  try{
    const res=await fetch('/api'+path,opts);
    const data=await res.json();
    return{ok:res.ok,data};
  }catch(e){return{ok:false,data:{error:e.message}};}
}

const viewTitles={dashboard:'Dashboard',courses:'Courses',subjects:'Subjects',papers:'Papers',chapters:'Chapters',lectures:'Lectures',resources:'Resources',users:'Users',memberships:'Memberships'};

// Sidebar click handler
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',function(){
    const view=this.getAttribute('data-view');
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('topbarTitle').textContent=viewTitles[view]||view;
    document.getElementById('sidebar').classList.remove('open');
    loadView(view);
  });
});

async function refreshAllData(){
  const[cR,sR,pR,chR,uR]=await Promise.all([
    api('GET','/admin/courses'),
    api('GET','/admin/all-subjects'),
    api('GET','/admin/all-papers'),
    api('GET','/admin/all-chapters'),
    api('GET','/admin/users')
  ]);
  allCourses=cR.ok?cR.data:[];
  allSubjects=sR.ok?sR.data:[];
  allPapers=pR.ok?pR.data:[];
  allChapters=chR.ok?chR.data:[];
  allUsers=uR.ok?uR.data:[];
}

async function loadView(id){
  const area=document.getElementById('contentArea');
  await refreshAllData();
  
  switch(id){
    case 'dashboard':
      area.innerHTML=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Courses</div><div class="stat-val">${allCourses.length}</div></div>
        <div class="stat-card"><div class="stat-label">Subjects</div><div class="stat-val">${allSubjects.length}</div></div>
        <div class="stat-card"><div class="stat-label">Papers</div><div class="stat-val">${allPapers.length}</div></div>
        <div class="stat-card"><div class="stat-label">Chapters</div><div class="stat-val">${allChapters.length}</div></div>
        <div class="stat-card"><div class="stat-label">Users</div><div class="stat-val">${allUsers.length}</div></div>
        <div class="stat-card"><div class="stat-label">Approved</div><div class="stat-val">${allUsers.filter(u=>u.is_approved).length}</div></div>
      </div>`;
      break;

    case 'courses':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">All Courses</h2><button class="btn btn-teal" onclick="openCourseModal()">+ New Course</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${allCourses.length?allCourses.map(c=>`<tr><td style="font-weight:600">${esc(c.title)}</td><td><span class="badge ${c.is_active?'badge-teal':'badge-red'}">${c.is_active?'Active':'Inactive'}</span></td><td><button class="btn btn-ghost btn-xs" onclick="editCourse(${c.id})">Edit</button> <button class="btn btn-red btn-xs" onclick="deleteCourse(${c.id})">Del</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No courses yet</td></tr>'}</tbody></table></div></div>`;
      break;

    case 'subjects':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Subjects</h2><button class="btn btn-teal" onclick="openSubjectModal()">+ New Subject</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Subject</th><th>Course</th><th>Papers</th><th>Actions</th></tr></thead>
        <tbody>${allSubjects.length?allSubjects.map(s=>`<tr><td style="font-weight:600">${esc(s.name)}</td><td>${allCourses.find(c=>c.id===s.course_id)?.title||'—'}</td><td>${s.has_papers?'Yes':'No'}</td><td><button class="btn btn-red btn-xs" onclick="deleteSubject(${s.id})">Del</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No subjects. Create a course first, then add subjects.</td></tr>'}</tbody></table></div></div>`;
      break;

    case 'papers':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Papers</h2><button class="btn btn-teal" onclick="openPaperModal()">+ New Paper</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Paper</th><th>Subject</th><th>Actions</th></tr></thead>
        <tbody>${allPapers.length?allPapers.map(p=>{const s=allSubjects.find(x=>x.id===p.subject_id);return`<tr><td style="font-weight:600">${esc(p.name)}</td><td>${esc(s?.name||'—')}</td><td><button class="btn btn-red btn-xs" onclick="deletePaper(${p.id})">Del</button></td></tr>`}).join(''):'<tr><td colspan="3" class="empty">No papers yet</td></tr>'}</tbody></table></div></div>`;
      break;

    case 'chapters':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Chapters</h2><button class="btn btn-teal" onclick="openChapterModal()">+ New Chapter</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Chapter</th><th>Paper</th><th>Actions</th></tr></thead>
        <tbody>${allChapters.length?allChapters.map(ch=>{const p=allPapers.find(x=>x.id===ch.paper_id);return`<tr><td style="font-weight:600">${esc(ch.title)}</td><td>${esc(p?.name||'—')}</td><td><button class="btn btn-red btn-xs" onclick="deleteChapter(${ch.id})">Del</button></td></tr>`}).join(''):'<tr><td colspan="3" class="empty">No chapters yet</td></tr>'}</tbody></table></div></div>`;
      break;

    case 'lectures':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Lectures</h2><button class="btn btn-teal" onclick="openLectureModal()">+ New Lecture</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Chapter</th><th>YT ID</th><th>Actions</th></tr></thead>
        <tbody id="lecTbody"><tr><td colspan="4" class="empty">Select a chapter to see lectures</td></tr></tbody></table></div></div>`;
      break;

    case 'resources':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Course Resources</h2><button class="btn btn-teal" onclick="openResourceModal()">+ New Resource</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Course</th><th>Actions</th></tr></thead>
        <tbody id="resTbody"><tr><td colspan="3" class="empty">Coming soon</td></tr></tbody></table></div></div>`;
      break;

    case 'users':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Users</h2></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${allUsers.map(u=>`<tr><td style="font-weight:600">${esc(u.name)}</td><td style="font-size:.7rem">${esc(u.email)}</td><td>${u.is_approved?'<span class="badge badge-teal">Approved</span>':'<span class="badge badge-red">Pending</span>'}${u.is_blocked?' <span class="badge badge-red">Blocked</span>':''}</td>
        <td>${!u.is_approved?`<button class="btn btn-green btn-xs" onclick="approveUser(${u.id})">Approve</button> `:''}${u.role!=='admin'?`<button class="btn btn-ghost btn-xs" onclick="toggleBlock(${u.id},${u.is_blocked})">${u.is_blocked?'Unblock':'Block'}</button> <button class="btn btn-red btn-xs" onclick="deleteUser(${u.id})">Del</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
      break;

    case 'memberships':
      area.innerHTML=`<div class="section-head"><h2 class="section-title">Memberships</h2><button class="btn btn-teal" onclick="openMembershipModal()">+ Grant</button></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>User</th><th>Course</th><th>Expires</th><th>Actions</th></tr></thead>
        <tbody id="memTbody"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody></table></div></div>`;
      loadMembershipsData();
      break;
  }
}

// ═══ COURSE MODAL ═══
function openCourseModal(id){
  const c=id?allCourses.find(x=>x.id===id):null;
  document.getElementById('genModalTitle').textContent=c?'Edit Course':'New Course';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <input type="hidden" id="editId" value="${c?.id||''}">
    <div class="form-group"><label class="form-label">Course Title *</label><input class="form-input" id="fTitle" value="${esc(c?.title||'')}"></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="fDesc">${esc(c?.description||'')}</textarea></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="saveCourse()">Save</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}

async function saveCourse(){
  const id=document.getElementById('editId').value;
  const title=document.getElementById('fTitle').value.trim();
  const description=document.getElementById('fDesc').value.trim();
  if(!title){showAlert('modalAlert','Title is required','error');return}
  const{ok}=await api(id?'PUT':'POST',id?`/admin/courses/${id}`:'/admin/courses',{title,description,is_active:1});
  if(!ok){showAlert('modalAlert','Error saving','error');return}
  closeGenModal();loadView('courses');
}
function editCourse(id){openCourseModal(id)}
async function deleteCourse(id){if(!confirm('Delete this course and ALL content?'))return;await api('DELETE',`/admin/courses/${id}`);loadView('courses')}

// ═══ SUBJECT MODAL ═══
function openSubjectModal(){
  document.getElementById('genModalTitle').textContent='New Subject';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">Course *</label><select class="form-select" id="fCourse">${allCourses.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')||'<option value="">No courses</option>'}</select></div>
    <div class="form-group"><label class="form-label">Subject Name *</label><input class="form-input" id="fName" placeholder="e.g. Physics"></div>
    <div class="form-group"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="fPapers" checked> Has Papers (1st/2nd Paper)</label></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="saveSubject()">Save</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}

async function saveSubject(){
  const course_id=parseInt(document.getElementById('fCourse').value);
  const name=document.getElementById('fName').value.trim();
  const has_papers=document.getElementById('fPapers').checked?1:0;
  if(!course_id||!name){showAlert('modalAlert','Course and name required','error');return}
  await api('POST','/admin/subjects',{course_id,name,has_papers});
  closeGenModal();loadView('subjects');
}
async function deleteSubject(id){if(!confirm('Delete subject?'))return;await api('DELETE',`/admin/subjects/${id}`);loadView('subjects')}

// ═══ PAPER MODAL ═══
function openPaperModal(){
  const subjOpts=allSubjects.filter(s=>s.has_papers).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  document.getElementById('genModalTitle').textContent='New Paper';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">Subject *</label><select class="form-select" id="fSubject">${subjOpts||'<option value="">No subjects with papers</option>'}</select></div>
    <div class="form-group"><label class="form-label">Paper Name *</label><input class="form-input" id="fName" placeholder="1st Paper / 2nd Paper"></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="savePaper()">Save</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}

async function savePaper(){
  const subject_id=parseInt(document.getElementById('fSubject').value);
  const name=document.getElementById('fName').value.trim();
  if(!subject_id||!name){showAlert('modalAlert','Subject and name required','error');return}
  await api('POST','/admin/papers',{subject_id,name});
  closeGenModal();loadView('papers');
}
async function deletePaper(id){if(!confirm('Delete paper?'))return;await api('DELETE',`/admin/papers/${id}`);loadView('papers')}

// ═══ CHAPTER MODAL ═══
function openChapterModal(){
  const paperOpts=allPapers.map(p=>{const s=allSubjects.find(x=>x.id===p.subject_id);return`<option value="${p.id}">${esc(p.name)} — ${esc(s?.name||'')}</option>`}).join('');
  document.getElementById('genModalTitle').textContent='New Chapter';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">Paper *</label><select class="form-select" id="fPaper">${paperOpts||'<option value="">No papers</option>'}</select></div>
    <div class="form-group"><label class="form-label">Chapter Title *</label><input class="form-input" id="fTitle"></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="saveChapter()">Save</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}

async function saveChapter(){
  const paper_id=parseInt(document.getElementById('fPaper').value);
  const title=document.getElementById('fTitle').value.trim();
  if(!paper_id||!title){showAlert('modalAlert','Paper and title required','error');return}
  await api('POST','/admin/chapters',{paper_id,title});
  closeGenModal();loadView('chapters');
}
async function deleteChapter(id){if(!confirm('Delete chapter?'))return;await api('DELETE',`/admin/chapters/${id}`);loadView('chapters')}

// ═══ LECTURE MODAL ═══
function openLectureModal(){
  const chOpts=allChapters.map(ch=>`<option value="${ch.id}">${esc(ch.title)}</option>`).join('');
  document.getElementById('genModalTitle').textContent='New Lecture';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">Chapter *</label><select class="form-select" id="fChapter">${chOpts||'<option value="">No chapters</option>'}</select></div>
    <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="fTitle"></div>
    <div class="form-group"><label class="form-label">YouTube Video ID *</label><input class="form-input" id="fYtId" placeholder="e.g. dQw4w9WgXcQ"></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="saveLecture()">Save</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}

async function saveLecture(){
  const chapter_id=parseInt(document.getElementById('fChapter').value);
  const title=document.getElementById('fTitle').value.trim();
  const yt_video_id=document.getElementById('fYtId').value.trim();
  if(!chapter_id||!title||!yt_video_id){showAlert('modalAlert','All fields required','error');return}
  await api('POST','/admin/lectures',{chapter_id,title,yt_video_id});
  closeGenModal();loadView('lectures');
}

// ═══ RESOURCE MODAL ═══
function openResourceModal(){
  document.getElementById('genModalTitle').textContent='New Resource';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">Course *</label><select class="form-select" id="fCourse">${allCourses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="fTitle"></div>

  document.getElementById('genModal').classList.add('open');
}
async function saveResource(){
  const course_id=parseInt(document.getElementById('fCourse').value);
  const title=document.getElementById('fTitle').value.trim();
  const pdf_url=document.getElementById('fUrl').value.trim();
  if(!course_id||!title||!pdf_url){showAlert('modalAlert','All fields required','error');return}
  await api('POST','/admin/resources',{course_id,title,pdf_url});

}

// ═══ MEMBERSHIPS ═══
async function loadMembershipsData(){
  const{ok,data}=await api('GET','/admin/memberships');
  document.getElementById('memTbody').innerHTML=data&&data.length?data.map(m=>`<tr><td>${esc(m.user_name)}</td><td>${esc(m.course_title)}</td><td>${new Date(m.expires_at).toLocaleDateString()}</td><td>${m.is_active?`<button class="btn btn-ghost btn-xs" onclick="extendMembership(${m.id})">Extend</button> <button class="btn btn-red btn-xs" onclick="cancelMembership(${m.id})">Cancel</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No memberships</td></tr>';
}
function openMembershipModal(){
  document.getElementById('genModalTitle').textContent='Grant Membership';
  document.getElementById('genModalBody').innerHTML=`
    <div class="alert" id="modalAlert"></div>
    <div class="form-group"><label class="form-label">User *</label><select class="form-select" id="fUser">${allUsers.filter(u=>u.is_approved).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Course *</label><select class="form-select" id="fCourse">${allCourses.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Days *</label><input class="form-input" type="number" id="fDays" value="30" min="1"></div>`;
  document.getElementById('genModalFooter').innerHTML=`<button class="btn btn-teal" onclick="saveMembership()">Grant</button><button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>`;
  document.getElementById('genModal').classList.add('open');
}
async function saveMembership(){
  const user_id=parseInt(document.getElementById('fUser').value);
  const course_id=parseInt(document.getElementById('fCourse').value);
  const days=parseInt(document.getElementById('fDays').value);
  if(!user_id||!course_id||!days){showAlert('modalAlert','All fields required','error');return}
  await api('POST','/admin/memberships',{user_id,course_id,days});
  closeGenModal();loadView('memberships');
}
async function extendMembership(id){const d=prompt('Days to extend?','30');if(d){await api('PUT',`/admin/memberships/${id}/extend`,{days:parseInt(d)});loadView('memberships');}}
async function cancelMembership(id){if(confirm('Cancel?')){await api('PUT',`/admin/memberships/${id}/cancel`);loadView('memberships');}}

// ═══ USERS ═══
async function approveUser(id){await api('PUT',`/admin/users/${id}/approve`);loadView('users')}
async function toggleBlock(id,cur){await api('PUT',`/admin/users/${id}/block`,{is_blocked:!cur});loadView('users')}
async function deleteUser(id){if(!confirm('Delete user?'))return;await api('DELETE',`/admin/users/${id}`);loadView('users')}

// ═══ HELPERS ═══
function closeGenModal(){document.getElementById('genModal').classList.remove('open')}
function showAlert(id,msg,type){const el=document.getElementById(id);if(el){el.className=`alert alert-${type} show`;el.textContent=msg}}
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function logout(){localStorage.clear();window.location.href='/index.html'}

// Start
loadView('dashboard');
</script>
</body>
</html>
