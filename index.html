<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhyudoy — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c12;--surface:#0f141c;--border:rgba(255,255,255,0.05);--teal:#00e5c3;--white:#fff;--gray:#7a8494;--red:#ff4757;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:44px 36px;width:100%;max-width:420px;text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo img{width:40px;height:40px;border-radius:10px}
.logo-text{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.logo-text span{color:var(--teal)}
.tagline{font-size:.82rem;color:var(--gray);margin-bottom:28px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:.7rem;font-weight:600;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.form-group input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.03);border:1.5px solid var(--border);border-radius:10px;color:var(--white);font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--teal)}
.btn{width:100%;padding:13px;background:var(--teal);color:#000;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alert{padding:10px 14px;border-radius:8px;font-size:.78rem;margin-bottom:14px;display:none}
.alert-error{display:block;background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.2);color:var(--red)}
.link-text{margin-top:16px;font-size:.8rem;color:var(--gray)}
.link-text a{color:var(--teal);text-decoration:none;font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/images/backend.png" alt="Abhyudoy" onerror="this.style.display='none'">
    <span class="logo-text">Abhy<span>udoy</span></span>
  </div>
  <p class="tagline">Your Path to Academic Excellence</p>
  <div class="alert" id="alert"></div>
  <form onsubmit="handleLogin(event)">
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="your@email.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Password" required></div>
    <button type="submit" class="btn" id="loginBtn">Sign In</button>
  </form>
  <p class="link-text">Don't have an account? <a href="/signup.html">Create Account</a></p>
</div>
<script>
async function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const alertEl=document.getElementById('alert');
  const btn=document.getElementById('loginBtn');
  alertEl.className='alert';
  if(!email||!password){alertEl.className='alert alert-error';alertEl.textContent='Please fill all fields';return}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Signing In...';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){alertEl.className='alert alert-error';alertEl.textContent=data.error;btn.disabled=false;btn.textContent='Sign In';return}
    localStorage.setItem('abhyudoy_token',data.token);
    localStorage.setItem('abhyudoy_user',JSON.stringify(data.user));
    window.location.href=data.user.role==='admin'?'/admin.html':'/dashboard.html';
  }catch(e){alertEl.className='alert alert-error';alertEl.textContent='Network error';btn.disabled=false;btn.textContent='Sign In'}
}
</script>
</body>
</html>
