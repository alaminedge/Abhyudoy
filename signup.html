<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #03050a;
  --surface: #080c17;
  --surface2: #0d1321;
  --surface3: #111827;
  --border: rgba(255,255,255,0.05);
  --border2: rgba(255,255,255,0.09);
  --border3: rgba(255,255,255,0.13);
  --teal: #00d4aa;
  --teal2: #00b894;
  --teal-dim: rgba(0,212,170,0.07);
  --teal-glow: rgba(0,212,170,0.14);
  --white: #f1f5f9;
  --gray: #6b7d91;
  --gray2: #94a3b8;
  --gray3: #cbd5e1;
  --red: #f0566a;
  --red-dim: rgba(240,86,106,0.08);
  --green: #10d48e;
  --orange: #f59e0b;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -180px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 500px;
  background: radial-gradient(ellipse, rgba(0,212,170,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0,212,170,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,170,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* Card */
.signup-card {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xl);
  padding: 44px 36px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,212,170,0.04);
  position: relative;
  z-index: 1;
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Logo */
.signup-logo {
  text-align: center;
  margin-bottom: 6px;
}

.signup-logo img { height: 36px; }

.signup-subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.56rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--gray);
  text-align: center;
  margin-bottom: 24px;
}

/* Notice */
.notice-box {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  background: rgba(245,158,11,0.06);
  border: 1px solid rgba(245,158,11,0.15);
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  font-size: 0.72rem;
  color: rgba(245,158,11,0.85);
  line-height: 1.5;
}

.notice-box svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Alert */
.alert {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.74rem;
  margin-bottom: 16px;
  display: none;
  line-height: 1.4;
  align-items: flex-start;
  gap: 8px;
}

.alert.show { display: flex; }
.alert-error { background: var(--red-dim); border: 1px solid rgba(240,86,106,0.2); color: var(--red); }
.alert-success { background: rgba(16,212,142,0.08); border: 1px solid rgba(16,212,142,0.2); color: var(--green); }
.alert svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }

/* Form */
.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gray);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 0.84rem;
  outline: none;
  transition: all var(--transition);
}

.form-input:focus {
  border-color: var(--teal);
  background: rgba(0,212,170,0.03);
  box-shadow: 0 0 0 3px var(--teal-dim);
}

.form-input::placeholder { color: rgba(107,125,145,0.4); }

.form-input-icon {
  position: relative;
}

.form-input-icon svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--gray);
  pointer-events: none;
}

.form-input-icon input {
  padding-left: 36px;
}

/* Password hint */
.pw-hint {
  font-size: 0.66rem;
  color: var(--gray);
  margin-top: 5px;
  line-height: 1.4;
}

.pw-hint span { color: var(--teal); font-weight: 600; }

/* Submit */
.btn-submit {
  width: 100%;
  padding: 11px;
  background: var(--teal);
  color: #000;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 0.84rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 4px;
}

.btn-submit:hover {
  background: var(--teal2);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,212,170,0.25);
}

.btn-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0,0,0,0.2);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}

.btn-submit.loading .spinner { display: block; }
.btn-submit.loading .btn-text { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.signup-footer {
  margin-top: 18px;
  text-align: center;
  font-size: 0.76rem;
  color: var(--gray);
}

.signup-footer a {
  color: var(--teal);
  text-decoration: none;
  font-weight: 600;
  transition: color var(--transition);
}

.signup-footer a:hover { color: var(--teal2); }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 0.78rem;
  color: var(--white);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: slideIn 0.3s ease, slideOut 0.3s ease 3s forwards;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 260px;
}

.toast-success { border-color: rgba(16,212,142,0.3); }
.toast-error { border-color: rgba(240,86,106,0.3); }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideOut {
  from { opacity: 1; }
  to { opacity: 0; transform: translateX(20px); }
}

@media (max-width: 480px) {
  .signup-card { padding: 32px 20px; }
}
</style>
</head>
<body>

<div class="signup-card">
  <div class="signup-logo">
    <img src="/images/reallogo.png" height="36" alt="Abhyudoy">
  </div>
  <div class="signup-subtitle">Create Your Account</div>

  <div class="notice-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>One account per device. Your account requires admin approval before you can sign in.</span>
  </div>

  <div class="alert" id="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="alertIcon"></svg>
    <span id="alertText"></span>
  </div>

  <form onsubmit="handleSignup(event)">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <div class="form-input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="name" placeholder="Your full name" required autocomplete="name">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <div class="form-input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="form-input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="Min. 6 characters" required autocomplete="new-password">
      </div>
      <div class="pw-hint">Must be at least <span>6 characters</span></div>
    </div>

    <button type="submit" class="btn-submit" id="signupBtn">
      <span class="spinner"></span>
      <span class="btn-text">Create Account</span>
    </button>
  </form>

  <div class="signup-footer">
    Already have an account? <a href="/index.html">Sign In</a>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// Check if already logged in
var token = localStorage.getItem('abhyudoy_token');
var user = JSON.parse(localStorage.getItem('abhyudoy_user') || 'null');

if (token && user) {
  if (user.role === 'admin') {
    window.location.href = '/admin.html';
  } else {
    window.location.href = '/dashboard.html';
  }
}

// Device fingerprint
function getFingerprint() {
  var data = [
    navigator.hardwareConcurrency,
    navigator.language,
    screen.width + 'x' + screen.height,
    new Date().getTimezoneOffset()
  ].join('|');
  var hash = 0;
  for (var i = 0; i < data.length; i++) {
    hash = ((hash << 5) - hash) + data.charCodeAt(i);
    hash |= 0;
  }
  return 'fp_' + Math.abs(hash).toString(36);
}

// Toast
function showToast(msg, type) {
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.innerHTML = '<span style="font-weight:700;color:' + (type === 'success' ? 'var(--green)' : 'var(--red)') + '">' + (type === 'success' ? '\u2713' : '\u2717') + '</span><span>' + msg + '</span>';
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3500);
}

// Alert
function showAlert(msg, type) {
  var alert = document.getElementById('alert');
  var icon = document.getElementById('alertIcon');
  var text = document.getElementById('alertText');

  alert.className = 'alert alert-' + type + ' show';
  text.textContent = msg;

  if (type === 'error') {
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
  } else {
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
  }

  setTimeout(function() { alert.classList.remove('show'); }, 5000);
}

// Signup
async function handleSignup(e) {
  e.preventDefault();

  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('signupBtn');
  var alert = document.getElementById('alert');

  alert.classList.remove('show');

  if (password.length < 6) {
    showAlert('Password must be at least 6 characters.', 'error');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    var res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name,
        email: email,
        password: password,
        device_fingerprint: getFingerprint()
      })
    });

    var data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Signup failed. Please try again.', 'error');
      btn.classList.remove('loading');
      btn.disabled = false;
      return;
    }

    showAlert('Account created! Awaiting admin approval.', 'success');
    document.querySelector('form').reset();
    btn.classList.remove('loading');
    btn.textContent = 'Account Created';
    btn.disabled = true;

    showToast('Redirecting to sign in...', 'success');

    setTimeout(function() {
      window.location.href = '/index.html';
    }, 3000);

  } catch (err) {
    showAlert('Network error. Please check your connection.', 'error');
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
