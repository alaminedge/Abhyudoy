<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhyudoy — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cabinet+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.08);
  --white:#f0f4f8;--gray:#7a8899;--red:#f0566a;--red-dim:rgba(240,86,106,0.1);
  --radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.025) 1px,transparent 1px);background-size:56px 56px;pointer-events:none}
body::after{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(0,212,170,0.07) 0%,transparent 70%);pointer-events:none}

.card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:48px 44px;box-shadow:0 40px 100px rgba(0,0,0,0.7);animation:up .5s ease;position:relative;z-index:1}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Logo image styling */
.logo{
  text-align:center;
  margin-bottom:12px;
}
.logo-img{
  max-width:120px;
  height:auto;
  display:inline-block;
}
.logo-text{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  font-weight:700;
  letter-spacing:-0.02em;
  margin-top:8px;
}
.logo-text em{font-style:italic;color:var(--teal)}
.logo-sub{font-size:0.72rem;color:var(--gray);text-align:center;margin-bottom:28px;letter-spacing:0.06em}

/* Notice styling - INSIDE the card */
.notice{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:var(--surface2);
  border-left:3px solid #f0c060;
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:24px;
  font-size:0.76rem;
  color:rgba(240,192,96,0.9);
  line-height:1.5;
}
.notice span:first-child{flex-shrink:0;font-size:1rem}
.notice span:last-child{flex:1}

.alert{padding:11px 14px;border-radius:var(--radius);font-size:0.77rem;margin-bottom:16px;display:none;line-height:1.4}
.alert.show{display:block}
.alert-error{background:var(--red-dim);border:1px solid rgba(240,86,106,0.22);color:var(--red)}
.alert-success{background:var(--teal-dim);border:1px solid rgba(0,212,170,0.2);color:var(--teal)}

.fg{margin-bottom:14px}
.fl{display:block;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gray);margin-bottom:6px;font-family:'DM Mono',monospace}
.fi{width:100%;padding:11px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--white);font-size:0.87rem;font-family:'Cabinet Grotesk',sans-serif;outline:none;transition:all .2s}
.fi:focus{border-color:var(--teal);background:rgba(0,212,170,0.03);box-shadow:0 0 0 3px var(--teal-dim)}
.fi::placeholder{color:rgba(122,136,153,0.45)}

.btn-sub{width:100%;padding:13px;background:var(--teal);color:#000;border:none;border-radius:var(--radius);font-family:'Cabinet Grotesk',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-sub:hover{background:var(--teal2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,170,0.28)}
.btn-sub:disabled{opacity:.5;cursor:not-allowed;transform:none}

.foot-link{margin-top:20px;text-align:center;font-size:0.78rem;color:var(--gray)}
.foot-link a{color:var(--teal);text-decoration:none;font-weight:600}

.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/images/reallogo.png" alt="Abhyudoy Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <div class="logo-text">Abhy<em>udoy</em></div>
  </div>
  <p class="logo-sub">Create Your Account</p>
  
  <!-- Disclaimer properly styled INSIDE the card -->
  <div class="notice">
    <span>⚠️</span>
    <span>One account per device. Your account requires admin approval before you can sign in.</span>
  </div>
  
  <div class="alert" id="alert"></div>
  <form onsubmit="doSignup(event)">
    <div class="fg"><label class="fl">Full Name</label><input class="fi" type="text" id="name" placeholder="Your full name" required autocomplete="name"></div>
    <div class="fg"><label class="fl">Email Address</label><input class="fi" type="email" id="email" placeholder="your@email.com" required autocomplete="email"></div>
    <div class="fg"><label class="fl">Password</label><input class="fi" type="password" id="password" placeholder="Min. 6 characters" required autocomplete="new-password"></div>
    <button type="submit" class="btn-sub" id="signupBtn">Create Account</button>
  </form>
  <p class="foot-link">Have an account? <a href="/index.html">Sign In</a></p>
</div>
<script>
function getFingerprint(){
  const d=[navigator.hardwareConcurrency,navigator.language,navigator.platform,screen.width+'x'+screen.height,new Date().getTimezoneOffset()].join('|');
  let h=0;for(let i=0;i<d.length;i++){h=((h<<5)-h)+d.charCodeAt(i);h|=0}
  return'fp_'+Math.abs(h).toString(36);
}

async function doSignup(e){
  e.preventDefault();
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const al=document.getElementById('alert'),btn=document.getElementById('signupBtn');
  al.className='alert';
  if(password.length<6){al.className='alert alert-error show';al.textContent='Password must be at least 6 characters.';return}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Creating Account…';
  try{
    const res=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,device_fingerprint:getFingerprint()})});
    const data=await res.json();
    if(!res.ok){al.className='alert alert-error show';al.textContent=data.error||'Signup failed.';btn.disabled=false;btn.textContent='Create Account';return}
    al.className='alert alert-success show';al.textContent='✓ Account created! Awaiting admin approval. You will be notified when ready.';
    document.querySelector('form').reset();btn.textContent='Account Created';
    setTimeout(()=>window.location.href='/index.html',3000);
  }catch{al.className='alert alert-error show';al.textContent='Network error. Try again.';btn.disabled=false;btn.textContent='Create Account'}
}
</script>
</body>
</html>
