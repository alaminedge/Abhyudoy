<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Cabinet+Grotesk:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.08);
  --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;
  --red:#f0566a;--orange:#f59e0b;--green:#10d48e;
  --radius:9px;--radius-lg:13px;--transition:.18s cubic-bezier(.4,0,.2,1);--sw:260px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

/* SIDEBAR OVERLAY */
.sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;opacity:0;pointer-events:none;transition:opacity .28s;backdrop-filter:blur(2px)}
.sb-overlay.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--surface);border-right:1px solid var(--border2);z-index:100;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-close{background:none;border:none;color:var(--gray);cursor:pointer;padding:4px;border-radius:6px;transition:all var(--transition);display:flex;align-items:center;justify-content:center}
.sb-close:hover{background:var(--surface2);color:var(--white)}
.sb-nav{flex:1;overflow-y:auto;padding:10px}
.sb-nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius);font-size:.83rem;font-weight:500;color:var(--gray2);text-decoration:none;transition:all var(--transition);border-left:2px solid transparent;margin-bottom:2px}
.sb-nav-item:hover{background:var(--surface2);color:var(--white)}
.sb-nav-item.active{background:var(--teal-dim);color:var(--teal);border-left-color:var(--teal)}
.sb-nav-item svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
.sb-divider{height:1px;background:var(--border);margin:10px 4px}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;flex-shrink:0}
.sb-user-name{font-size:.8rem;font-weight:600;color:var(--white);line-height:1.2}
.sb-user-email{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--gray);margin-top:1px}
.btn-signout{width:100%;padding:8px;border:1.5px solid rgba(240,86,106,.3);background:transparent;color:var(--red);border-radius:var(--radius);font-family:'Cabinet Grotesk',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;transition:all var(--transition);text-transform:uppercase;letter-spacing:.04em}
.btn-signout:hover{background:var(--red);color:#fff;border-color:var(--red)}

/* HEADER */
header{position:sticky;top:0;z-index:80;height:64px;background:rgba(5,8,15,0.93);backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.hdr{max-width:1280px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-left{display:flex;align-items:center;gap:14px}
.hbtn{background:none;border:none;color:var(--gray2);cursor:pointer;padding:6px;border-radius:6px;transition:all var(--transition);display:flex;align-items:center;justify-content:center}
.hbtn:hover{background:var(--surface2);color:var(--white)}
.hdr-logo img{height:30px;object-fit:contain}
.hdr-right{display:flex;align-items:center;gap:8px}
.notif-wrap{position:relative}
.notif-btn{background:none;border:none;color:var(--gray2);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all var(--transition)}
.notif-btn:hover{background:var(--surface2);color:var(--white)}
.notif-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--red);color:#fff;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;border-radius:8px;display:none;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px}
.notif-badge.show{display:flex}
.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;background:var(--surface);border:1px solid var(--border2);border-radius:24px;cursor:pointer;transition:all var(--transition)}
.profile-btn:hover{border-color:var(--teal);background:var(--surface2)}
.p-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.66rem}
.p-name{font-size:.78rem;font-weight:600;color:var(--gray2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-chevron{color:var(--gray);transition:transform var(--transition)}
.profile-btn.open .p-chevron{transform:rotate(180deg)}
.profile-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:200px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);display:none}
.profile-dropdown.open{display:block;animation:fadeDown .15s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.pd-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:.8rem;color:var(--gray2);cursor:pointer;text-decoration:none;transition:all var(--transition)}
.pd-item:hover{background:var(--surface2);color:var(--white)}
.pd-item svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
.pd-item.danger{color:var(--red)}
.pd-item.danger:hover{background:rgba(240,86,106,.09)}
.pd-divider{height:1px;background:var(--border);margin:4px 0}

/* PAGE */
.page{max-width:960px;margin:0 auto;padding:40px 24px 80px}

/* COURSE HEADER */
.course-head{margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-family:'DM Mono',monospace;font-size:.62rem}
.breadcrumb a{color:var(--gray);text-decoration:none;transition:color var(--transition)}
.breadcrumb a:hover{color:var(--teal)}
.breadcrumb span{color:rgba(255,255,255,.2)}
.breadcrumb-cur{color:var(--gray2)}
.course-eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.course-eyebrow::before{content:'';display:block;width:18px;height:1.5px;background:var(--teal)}
.course-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin-bottom:14px}
.course-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meta-chip{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--gray);display:flex;align-items:center;gap:5px}
.meta-chip svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
.expiry-tag{font-family:'DM Mono',monospace;font-size:.63rem;padding:4px 10px;border-radius:20px;background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,.2)}
.expiry-warn{background:rgba(245,158,11,.09);color:var(--orange);border-color:rgba(245,158,11,.2)}
.expiry-expired{background:rgba(240,86,106,.09);color:var(--red);border-color:rgba(240,86,106,.2)}

/* PROGRESS BAR */
.progress-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog-label{font-size:.78rem;color:var(--gray);font-weight:500;flex-shrink:0}
.prog-track{flex:1;min-width:120px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:2px;transition:width .4s ease}
.prog-pct{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);flex-shrink:0}

/* SUBJECTS */
.subjects-list{display:flex;flex-direction:column;gap:12px}
.subject-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color var(--transition)}
.subject-card.open{border-color:rgba(0,212,170,.2)}
.subject-toggle{width:100%;background:transparent;border:none;padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;transition:background var(--transition)}
.subject-toggle:hover{background:rgba(255,255,255,.02)}
.subj-num{font-family:'DM Mono',monospace;font-size:.64rem;color:var(--teal);width:28px;flex-shrink:0;opacity:.7;font-weight:500}
.subj-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:700;color:var(--white);flex:1;letter-spacing:-.01em;text-align:left}
.subj-count{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--gray);flex-shrink:0;margin-right:6px}
.subj-chevron{color:var(--gray);transition:transform .25s;flex-shrink:0;display:flex}
.subj-chevron svg{width:16px;height:16px;fill:currentColor}
.subject-card.open .subj-chevron{transform:rotate(180deg)}
.subject-card.open .subj-chevron{color:var(--teal)}

.subject-content{display:none;padding:0 0 14px}
.subject-card.open .subject-content{display:block}

/* PAPERS */
.paper-section{margin:0 16px 10px}
.paper-label{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);padding:10px 14px 6px;display:flex;align-items:center;gap:8px}
.paper-label::before{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--teal);flex-shrink:0;opacity:.7}

/* CHAPTERS */
.chapter-section{padding:0 4px}
.chapter-label{font-size:.73rem;font-weight:600;color:var(--gray2);padding:8px 16px 4px;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.chapter-label::before{content:'§';color:var(--teal);font-size:.72rem;opacity:.6}

/* LECTURES */
.lecture-item{display:flex;align-items:center;gap:12px;padding:9px 16px;border-radius:8px;cursor:pointer;transition:all .15s;margin:2px 6px;border:1px solid transparent;text-decoration:none}
.lecture-item:hover{background:var(--surface2);border-color:var(--border)}
.lec-play{width:28px;height:28px;border-radius:50%;background:var(--teal-dim);border:1px solid rgba(0,212,170,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--transition)}
.lec-play svg{width:10px;height:10px;fill:var(--teal);margin-left:1px;transition:fill var(--transition)}
.lecture-item:hover .lec-play{background:var(--teal);border-color:var(--teal)}
.lecture-item:hover .lec-play svg{fill:#000}
.lec-title{font-size:.8rem;color:var(--gray2);flex:1;line-height:1.4;transition:color .15s}
.lecture-item:hover .lec-title{color:var(--white)}
.lec-pdf-badge{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--teal);background:var(--teal-dim);padding:2px 8px;border-radius:10px;flex-shrink:0}

/* RESOURCES */
.resources-section{margin-top:36px;padding-top:28px;border-top:1px solid var(--border)}
.res-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.res-list{display:flex;flex-direction:column;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:var(--gray2);transition:all var(--transition);font-size:.8rem}
.res-item:hover{border-color:rgba(0,212,170,.2);color:var(--white);background:var(--surface2)}
.res-ico{width:30px;height:30px;background:var(--teal-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res-ico svg{width:14px;height:14px;fill:var(--teal)}

/* LOADING / ERROR */
.loading-state{text-align:center;padding:80px;color:var(--gray)}
.ring{width:32px;height:32px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:80px;color:var(--gray)}
.error-state h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--white);margin-bottom:8px}
.error-state p{font-size:.82rem;margin-bottom:18px;line-height:1.6}
.btn-back{padding:10px 22px;background:var(--teal);color:#000;border:none;border-radius:var(--radius);font-family:'Cabinet Grotesk',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all var(--transition);text-decoration:none;display:inline-block}
.btn-back:hover{background:var(--teal2);transform:translateY(-1px)}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border)}
.footer-bottom{max-width:1280px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.footer-bottom p{font-family:'DM Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.2)}
.footer-links{display:flex;gap:20px}
.footer-links a{font-size:.72rem;color:var(--gray);text-decoration:none;transition:color var(--transition)}
.footer-links a:hover{color:var(--white)}

@media(max-width:768px){.page{padding:28px 16px 60px}.hdr{padding:0 16px}}
</style>
</head>

        <div class="profile-dropdown" id="profileDropdown">
          <a href="/settings.html" class="pd-item"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Settings</a>
          <a href="/notifications.html" class="pd-item"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>Notifications</a>
          <div class="pd-divider"></div>
          <div class="pd-item danger" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>Sign Out</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="page" id="pageContent">
  <div class="loading-state"><div class="ring"></div><p style="font-size:.82rem">Loading course…</p></div>
</div>

<footer>
  <div class="footer-bottom">
    <p>© 2024 Abhyudoy. All rights reserved.</p>
    <div class="footer-links">
      <a href="/dashboard.html">My Courses</a>
      <a href="/browse.html">Browse</a>
      <a href="/contact.html">Support</a>
    </div>
  </div>
</footer>

<script>
const token=localStorage.getItem('abhyudoy_token');
const user=JSON.parse(localStorage.getItem('abhyudoy_user')||'null');
if(!token||!user){window.location.href='/index.html';}
const courseId=new URLSearchParams(location.search).get('id');
if(!courseId){window.location.href='/dashboard.html';}

// UI init
const initial=user.name.charAt(0).toUpperCase();
document.getElementById('pAvatar').textContent=initial;
document.getElementById('pName').textContent=user.name;
document.getElementById('sbAvatar').textContent=initial;
document.getElementById('sbName').textContent=user.name;
document.getElementById('sbEmail').textContent=user.email;

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sbOverlay').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOverlay').classList.remove('open');}
function toggleProfile(){const d=document.getElementById('profileDropdown'),b=document.getElementById('profileBtn');d.classList.toggle('open');b.classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap')){document.getElementById('profileDropdown').classList.remove('open');document.getElementById('profileBtn').classList.remove('open');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSidebar();}});
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function logout(){localStorage.clear();window.location.href='/index.html';}

// Open first subject by default
function toggleSubject(idx){
  const el=document.getElementById('subj-'+idx);
  if(!el)return;
  el.classList.toggle('open');
}

async function loadNotifBadge(){
  try{
    const res=await fetch('/api/user/notifications',{headers:{Authorization:'Bearer '+token}});
    if(res.ok){const d=await res.json();const u=d.filter(n=>!n.is_read).length;if(u>0){document.getElementById('notifBadge').textContent=u>9?'9+':u;document.getElementById('notifBadge').classList.add('show');}}
  }catch{}
}

async function load(){
  try{
    const res=await fetch(`/api/user/course/${courseId}`,{headers:{Authorization:'Bearer '+token}});
    if(res.status===401){window.location.href='/index.html';return;}
    if(res.status===403){window.location.href='/dashboard.html';return;}
    const d=await res.json();
    if(d.error){window.location.href='/dashboard.html';return;}

    document.title=d.course.title+' — Abhyudoy';

    // Compute stats
    let totalLec=0,totalSubj=d.subjects.length;
    d.subjects.forEach(s=>s.papers.forEach(p=>p.chapters.forEach(ch=>totalLec+=ch.lectures.length)));

    // Expiry tag
    let expiryTag='';
    if(d.membership?.expires_at){
      const exp=new Date(d.membership.expires_at),now=new Date();
      const days=Math.ceil((exp-now)/86400000);
      if(days<0)expiryTag=`<span class="expiry-tag expiry-expired">Expired</span>`;
      else if(days<=7)expiryTag=`<span class="expiry-tag expiry-warn">${days}d left</span>`;
      else expiryTag=`<span class="expiry-tag">Expires ${exp.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>`;
    }else if(user.role==='admin'){
      expiryTag=`<span class="expiry-tag">Admin Access</span>`;
    }

    let html=`
      <div class="course-head">
        <div class="breadcrumb">
          <a href="/dashboard.html">My Courses</a>
          <span>›</span>
          <span class="breadcrumb-cur">${esc(d.course.title.length>40?d.course.title.substring(0,40)+'…':d.course.title)}</span>
        </div>
        <div class="course-eyebrow">Course Content</div>
        <h1 class="course-title">${esc(d.course.title)}</h1>
        <div class="course-meta">
          <span class="meta-chip"><svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>${totalSubj} Subject${totalSubj!==1?'s':''}</span>
          <span class="meta-chip"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM10 8l6 4-6 4V8z"/></svg>${totalLec} Lecture${totalLec!==1?'s':''}</span>
          ${expiryTag}
        </div>
      </div>
      <div class="subjects-list">`;

    d.subjects.forEach((subj,si)=>{
      let lecCount=0;
      subj.papers.forEach(p=>p.chapters.forEach(ch=>lecCount+=ch.lectures.length));
      html+=`<div class="subject-card" id="subj-${si}">
        <button class="subject-toggle" onclick="toggleSubject(${si})">
          <span class="subj-num">${String(si+1).padStart(2,'0')}</span>
          <span class="subj-name">${esc(subj.name)}</span>
          <span class="subj-count">${lecCount} lec</span>
          <span class="subj-chevron"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></span>
        </button>
        <div class="subject-content">`;

      subj.papers.forEach((paper)=>{
        const showPaper=subj.papers.length>1||(paper.name!=='Full Course'&&paper.name!==subj.name);
        html+=`<div class="paper-section">`;
        if(showPaper)html+=`<div class="paper-label">${esc(paper.name)}</div>`;
        html+=`<div class="chapter-section">`;
        paper.chapters.forEach(ch=>{
          html+=`<div class="chapter-label">${esc(ch.title)}</div>`;
          ch.lectures.forEach(lec=>{
            const hasPdf=lec.pdfs&&lec.pdfs.length>0;
            html+=`<a class="lecture-item" href="/player.html?lecture=${lec.id}&course=${courseId}">
              <div class="lec-play"><svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg></div>
              <span class="lec-title">${esc(lec.title)}</span>
              ${hasPdf?`<span class="lec-pdf-badge"><svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:currentColor;margin-right:3px"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1z"/></svg>${lec.pdfs.length} PDF${lec.pdfs.length>1?'s':''}</span>`:''}
            </a>`;
          });
        });
        html+=`</div></div>`;
      });
      html+=`</div></div>`;
    });

    html+=`</div>`;

    if(d.resources&&d.resources.length){
      html+=`<div class="resources-section">
        <h2 class="res-title">Course Resources</h2>
        <div class="res-list">${d.resources.map(r=>`
          <a href="${esc(r.pdf_url)}" target="_blank" rel="noopener" class="res-item">
            <div class="res-ico"><svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5z"/></svg></div>
            <span>${esc(r.title)}</span>
          </a>`).join('')}
        </div>
      </div>`;
    }

    document.getElementById('pageContent').innerHTML=html;
    // Open first subject
    if(d.subjects.length>0)toggleSubject(0);

  }catch(e){
    document.getElementById('pageContent').innerHTML=`
      <div class="error-state">
        <h3>Could Not Load Course</h3>
        <p>There was a problem loading this course. Please try again.</p>
        <a href="/dashboard.html" class="btn-back">Back to Dashboard</a>
      </div>`;
  }
}

load();loadNotifBadge();
</script>
</body>
</html>
