<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — Abhyudoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cabinet+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
  --teal:#00d4aa;--teal2:#00b894;--teal-dim:rgba(0,212,170,0.08);
  --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;
  --red:#f0566a;--orange:#f59e0b;--radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}

/* NAV */
nav{background:rgba(11,15,26,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;letter-spacing:-0.02em;text-decoration:none;color:var(--white)}
.nav-logo em{font-style:italic;color:var(--teal)}
.btn-back{padding:7px 16px;background:transparent;border:1.5px solid var(--border2);color:var(--gray);border-radius:20px;cursor:pointer;font-size:0.72rem;font-weight:600;font-family:'Cabinet Grotesk',sans-serif;transition:all .2s;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-back:hover{border-color:var(--teal);color:var(--teal)}

/* LAYOUT */
.page{max-width:1000px;margin:0 auto;padding:36px 28px 80px}

/* COURSE HEADER */
.course-head{margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.course-eyebrow{font-family:'DM Mono',monospace;font-size:0.63rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.course-eyebrow::before{content:'';display:block;width:18px;height:1.5px;background:var(--teal)}
.course-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,3vw,2.4rem);font-weight:700;letter-spacing:-0.02em;margin-bottom:10px;line-height:1.2}
.course-meta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meta-chip{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--gray);display:flex;align-items:center;gap:5px}
.expiry-tag{font-family:'DM Mono',monospace;font-size:0.64rem;padding:4px 10px;border-radius:20px;background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,0.2)}

/* SUBJECTS */
.subjects{display:flex;flex-direction:column;gap:14px}

.subject-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}
.subject-block.open{border-color:rgba(0,212,170,0.18)}

.subject-toggle{width:100%;background:transparent;border:none;padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;transition:background .2s}
.subject-toggle:hover{background:rgba(255,255,255,0.02)}
.subject-num{font-family:'DM Mono',monospace;font-size:0.65rem;font-weight:500;color:var(--teal);width:26px;flex-shrink:0;opacity:0.7}
.subject-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600;color:var(--white);flex:1;letter-spacing:-0.01em}
.subject-count{font-family:'DM Mono',monospace;font-size:0.63rem;color:var(--gray);margin-right:8px}
.subject-chevron{color:var(--gray);font-size:0.7rem;transition:transform .25s;flex-shrink:0}
.subject-block.open .subject-chevron{transform:rotate(180deg);color:var(--teal)}

.subject-content{display:none;padding:0 0 12px}
.subject-block.open .subject-content{display:block}

/* PAPERS */
.paper-block{margin:0 16px 10px;border-radius:8px;overflow:hidden}
.paper-label{font-family:'DM Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gray);padding:10px 14px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.paper-label::before{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--teal);flex-shrink:0}

/* CHAPTERS */
.chapter-block{padding:0 4px}
.chapter-label{font-size:0.72rem;font-weight:600;color:var(--gray2);padding:8px 14px 4px;display:flex;align-items:center;gap:8px}
.chapter-label::before{content:'§';color:var(--teal);font-size:0.75rem;opacity:0.7}

/* LECTURES */
.lecture-item{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;cursor:pointer;transition:all .15s;margin:2px 4px;border:1px solid transparent}
.lecture-item:hover{background:var(--surface2);border-color:var(--border)}
.lec-play{width:28px;height:28px;border-radius:50%;background:var(--teal-dim);border:1px solid rgba(0,212,170,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.lecture-item:hover .lec-play{background:var(--teal);border-color:var(--teal)}
.lec-play svg{width:10px;height:10px;fill:var(--teal);margin-left:1px;transition:fill .2s}
.lecture-item:hover .lec-play svg{fill:#000}
.lec-title{font-size:0.8rem;color:var(--gray2);flex:1;line-height:1.4;transition:color .15s}
.lecture-item:hover .lec-title{color:var(--white)}
.lec-pdf{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--teal);background:var(--teal-dim);padding:2px 8px;border-radius:10px;flex-shrink:0}

/* RESOURCES */
.resources-section{margin-top:36px;padding-top:28px;border-top:1px solid var(--border)}
.res-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;margin-bottom:14px;letter-spacing:-0.01em}
.res-grid{display:flex;flex-direction:column;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:var(--gray2);transition:all .2s;font-size:0.8rem}
.res-item:hover{border-color:rgba(0,212,170,0.2);color:var(--white);background:var(--surface2)}
.res-ico{width:30px;height:30px;background:var(--teal-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}

/* LOADING/EMPTY */
.loading{text-align:center;padding:80px;color:var(--gray)}
.ring{width:32px;height:32px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){.page{padding:24px 16px 60px}nav{padding:0 16px}}
</style>
</head>
<body>
<nav>
  <a href="/dashboard.html" class="nav-logo">Abhy<em>udoy</em></a>
  <a href="/dashboard.html" class="btn-back">← My Courses</a>
</nav>

<div class="page" id="page">
  <div class="loading"><div class="ring"></div><p style="font-size:.82rem">Loading course…</p></div>
</div>

<script>
const token=localStorage.getItem('abhyudoy_token');
const user=JSON.parse(localStorage.getItem('abhyudoy_user')||'null');
if(!token||!user){window.location.href='/index.html';}
const courseId=new URLSearchParams(location.search).get('id');
if(!courseId)window.location.href='/dashboard.html';

async function load(){
  try{
    const res=await fetch(`/api/user/course/${courseId}`,{headers:{Authorization:'Bearer '+token}});
    if(res.status===401){window.location.href='/index.html';return}
    if(res.status===403){window.location.href='/dashboard.html';return}
    const d=await res.json();
    if(d.error){window.location.href='/dashboard.html';return}
    document.title=d.course.title+' — Abhyudoy';

    // Count totals
    let totalLec=0;
    d.subjects.forEach(s=>s.papers.forEach(p=>p.chapters.forEach(ch=>totalLec+=ch.lectures.length)));

    const exp=d.membership?.expires_at?new Date(d.membership.expires_at):null;
    const expText=exp?`Expires ${exp.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`:'';

    let html=`<div class="course-head">
      <div class="course-eyebrow">Course Content</div>
      <h1 class="course-title">${esc(d.course.title)}</h1>
      <div class="course-meta-row">
        <span class="meta-chip">📚 ${d.subjects.length} Subject${d.subjects.length!==1?'s':''}</span>
        <span class="meta-chip">🎬 ${totalLec} Lecture${totalLec!==1?'s':''}</span>
        ${expText?`<span class="expiry-tag">${expText}</span>`:''}
      </div>
    </div>
    <div class="subjects">`;

    d.subjects.forEach((subj,si)=>{
      let lecCount=0;subj.papers.forEach(p=>p.chapters.forEach(ch=>lecCount+=ch.lectures.length));
      html+=`<div class="subject-block" id="subj-${si}">
        <button class="subject-toggle" onclick="toggleSubject(${si})">
          <span class="subject-num">${String(si+1).padStart(2,'0')}</span>
          <span class="subject-name">${esc(subj.name)}</span>
          <span class="subject-count">${lecCount} lec</span>
          <span class="subject-chevron">▼</span>
        </button>
        <div class="subject-content">`;

      subj.papers.forEach((paper,pi)=>{
        const showPaperLabel=subj.papers.length>1||paper.name!=='Full Course';
        html+=`<div class="paper-block">`;
        if(showPaperLabel)html+=`<div class="paper-label">${esc(paper.name)}</div>`;
        html+=`<div class="chapter-block">`;
        paper.chapters.forEach(ch=>{
          html+=`<div class="chapter-label">${esc(ch.title)}</div>`;
          ch.lectures.forEach(lec=>{
            const hasPdf=lec.pdfs&&lec.pdfs.length>0;
            html+=`<div class="lecture-item" onclick="window.location.href='/player.html?lecture=${lec.id}&course=${courseId}'">
              <div class="lec-play"><svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg></div>
              <span class="lec-title">${esc(lec.title)}</span>
              ${hasPdf?`<span class="lec-pdf">📎 ${lec.pdfs.length}</span>`:''}
            </div>`;
          });
        });
        html+=`</div></div>`;
      });

      html+=`</div></div>`;
    });

    html+=`</div>`;

    if(d.resources&&d.resources.length){
      html+=`<div class="resources-section">
        <h2 class="res-title">Course Resources</h2>
        <div class="res-grid">${d.resources.map(r=>`<a href="${esc(r.pdf_url)}" target="_blank" rel="noopener" class="res-item"><div class="res-ico">📄</div><span>${esc(r.title)}</span></a>`).join('')}</div>
      </div>`;
    }

    document.getElementById('page').innerHTML=html;
    // Open first subject by default
    if(d.subjects.length)toggleSubject(0);
  }catch(e){document.getElementById('page').innerHTML='<div class="loading"><p style="color:#f0566a">Failed to load course. Please refresh.</p></div>'}
}

function toggleSubject(i){
  const el=document.getElementById('subj-'+i);
  if(!el)return;
  el.classList.toggle('open');
}

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
load();
</script>
</body>
</html>
